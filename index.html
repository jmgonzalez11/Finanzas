/* ---------- alertas de cargos raros ---------- */
function computeAlerts() {
  const out = [], t = today(), since = addDays(t, -45);
  const add = (id, level, title, detail) => { if (!(S.settings.dismissedAlerts || {})[id]) out.push({ id, level, title, detail }); };
  const exp = allTx().filter(x => !x.dupOf && counted(x) && dir(x) < 0 && x.rawName);
  const byKey = {};
  exp.forEach(x => { const k = matchKey(x.rawName).slice(0, 30); (byKey[k] = byKey[k] || []).push(x); });
  Object.values(byKey).forEach(list => {
    list.sort((a, b) => a.date.localeCompare(b.date));
    list.forEach((x, i) => {
      if (x.date < since) return;
      // 1. cobro inusualmente alto para ese comercio
      const prev = list.slice(0, i).map(p => clp(p)).sort((a, b) => a - b);
      if (prev.length >= 4 && !/APPLE|GOOGLE|AMAZON|MERCADO|PAYPAL|PADDLE|MERPAGO|MP /.test(norm(x.rawName))) {
        const med = prev[Math.floor(prev.length / 2)], v = clp(x);
        if (v > med * 2 && v - med > 5000) add(`high|${x.id}`, 'mid', `Cobro alto en ${displayName(x)}`, `${fmtCLP(v)} el ${dmy(x.date)}; lo habitual es ${fmtCLP(med)}.`);
      }
      // 2. posible cobro duplicado (mismo comercio, monto y día)
      const twin = list.find((y, j) => j < i && y.date === x.date && y.currency === x.currency && Math.abs(y.amount - x.amount) < 0.01 && y.id !== x.id);
      if (twin) add(`dup|${twin.id}|${x.id}`, 'mid', `¿Cobro repetido en ${displayName(x)}?`, `Dos cobros de ${x.currency === 'USD' ? fmtUSD(x.amount) : fmtCLP(x.amount)} el ${dmy(x.date)}. Si es un error, reclámalo al comercio o al banco.`);
    });
  });
  // 3. cargos nuevos de la tarjeta frente al estado de cuenta anterior
  const byCard = {};
  statements().forEach(st => (byCard[st.card] = byCard[st.card] || []).push(st));
  Object.values(byCard).forEach(sts => {
    sts.sort((a, b) => a.date.localeCompare(b.date));
    if (sts.length < 2) return;
    const [prev, last] = sts.slice(-2);
    const names = st => new Set((st.items || []).filter(i => isFee(i) && i.vc > 0).map(i => itemName(i)));
    const before = names(prev);
    [...names(last)].filter(n => !before.has(n)).forEach(n => add(`fee|${last.id}|${n}`, 'no', `Cargo nuevo de la tarjeta: ${n}`, `Apareció en el estado de cuenta del ${dmy(last.to || last.date)} y no estaba en el anterior.`));
  });
  // 4. suscripciones nuevas o que subieron de precio
  subsData().filter(s => s.active && !s.manual).forEach(sd => {
    const known = firstDataDate() && firstDataDate() <= addDays(sd.last.date, -60);   // solo si hay historia suficiente para saber que es nueva
    if (known && sd.items.length === 1 && sd.last.date >= since) add(`newsub|${sd.name}`, 'ok', `Suscripción nueva: ${sd.name}`, `Primer cobro el ${dmy(sd.last.date)} por ${sd.last.currency === 'USD' ? fmtUSD(sd.last.amount) : fmtCLP(sd.last.amount)}.`);
    if (sd.items.length >= 2) {
      const [a, b] = sd.items.slice(-2);
      if (a.currency === b.currency && b.amount > a.amount * 1.05 && b.date >= since) add(`subup|${sd.name}|${b.id}`, 'mid', `${sd.name} subió de precio`, `De ${a.currency === 'USD' ? fmtUSD(a.amount) : fmtCLP(a.amount)} a ${b.currency === 'USD' ? fmtUSD(b.amount) : fmtCLP(b.amount)}.`);
    }
  });
  return out;
}
function alertsHtml() {
  const A = computeAlerts();
  if (!A.length) return '';
  const open = S.ui.showAlerts;
  S.ui.showAlerts = false;
  return `<details class="panel alerts" ${open ? 'open' : ''} style="margin-top:12px"><summary><b>${A.length} alerta${A.length > 1 ? 's' : ''}</b> <span class="muted">(toca para ver)</span></summary>
    <ul class="recs" style="margin-top:10px">${A.map(a => `<li style="--c:${a.level === 'no' ? 'var(--exp)' : a.level === 'mid' ? 'var(--warn)' : 'var(--inc)'}"><b>${esc(a.title)}</b>${esc(a.detail)}<br><button class="link" style="font-size:13px" data-dismiss="${esc(a.id)}">Descartar</button></li>`).join('')}</ul></details>`;
}

/* =====================================================================
   Análisis: resumen del mes, recomendaciones, consulta de compra, honorarios
   ===================================================================== */
const firstDataDate = () => allTx().filter(x => counted(x) && x.source !== 'fijo').map(x => x.date).sort()[0] || '';
const daysInMonth = ym => +dueOn(+ym.slice(0, 4), +ym.slice(5, 7), 31).slice(8, 10);
/* Meses anteriores completos con datos (hasta 3) */
function historyMonths(ym) {
  const first = firstDataDate();
  if (!first) return [];
  return [1, 2, 3].map(k => addMonths(ym, -k)).filter(m => m > first.slice(0, 7) || (m === first.slice(0, 7) && +first.slice(8, 10) <= 5));
}
function expByCat(ym) {
  const g = {};
  monthTx(ym).filter(t => counted(t) && dir(t) < 0).forEach(t => { const c = categoryOf(t); g[c] = (g[c] || 0) + clp(t); });
  return g;
}
/* Cada categoría del mes comparada con su promedio habitual (a la fecha, si es el mes en curso) */
function catCompare(ym) {
  const cur = expByCat(ym), total = Object.values(cur).reduce((a, v) => a + v, 0);
  const hm = historyMonths(ym), hist = hm.map(expByCat);
  const partial = ym === ymNow() ? +today().slice(8, 10) / daysInMonth(ym) : 1;
  const cats = new Set([...Object.keys(cur), ...hist.flatMap(h => Object.keys(h))]);
  const rows = [...cats].map(cat => {
    const v = cur[cat] || 0;
    const avg = hm.length ? hist.reduce((a, h) => a + (h[cat] || 0), 0) / hm.length * partial : null;
    let label = 'sin historial para comparar', trend = 0;
    if (avg != null) {
      if (avg < 1) { label = v ? 'nuevo: no aparece en los meses anteriores' : 'igual que lo habitual'; trend = v ? 2 : 0; }
      else {
        const r = v / avg - 1;
        if (Math.abs(r) <= 0.10) { label = 'similar a lo habitual'; trend = 0; }
        else if (r > 0.30) { label = 'bastante mayor que lo habitual'; trend = 2; }
        else if (r > 0) { label = 'levemente mayor que lo habitual'; trend = 1; }
        else if (r < -0.30) { label = 'bastante menor que lo habitual'; trend = -2; }
        else { label = 'levemente menor que lo habitual'; trend = -1; }
      }
    }
    return { cat, v, pct: total ? v / total * 100 : 0, avg, label, trend };
  }).filter(r => r.v > 0 || (r.avg || 0) > 0).sort((a, b) => b.v - a.v);
  const hTot = hm.length ? hist.reduce((a, h) => a + Object.values(h).reduce((x, y) => x + y, 0), 0) / hm.length * partial : null;
  return { rows, total, hTot, months: hm.length, partial: partial < 1 };
}
function cmpSentence(r) {
  return `${r.cat}: se gastó ${fmtCLP(r.v)}, el ${Math.round(r.pct)}% del total, ${r.label}${r.avg != null && r.avg >= 1 ? ` (${fmtCLP(r.avg)})` : ''}.`;
}

/* Foto de las finanzas para recomendaciones y consultas de compra */
function snapshot() {
  const ym = ymNow(), hm = historyMonths(ym);
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  let inc, exp, basis;
  if (hm.length) { inc = avg(hm.map(m => totals(m).inc)); exp = avg(hm.map(m => totals(m).exp)); basis = `promedio de ${hm.length} mes${hm.length > 1 ? 'es' : ''}`; }
  else { const T = totals(ym), P = monthProjection(); inc = T.inc + P.pendInc; exp = T.exp + P.fixedExp + P.varLeft; basis = 'proyección de este mes (aún hay poca historia)'; }
  const fixedInc = fixedRecs().filter(f => TIPOS[f.tipo].dir > 0 && (!f.end || f.end >= today())).reduce((a, f) => a + fixedCLP(f), 0);
  if (!inc && fixedInc) inc = fixedInc;
  const months = Array.from({length: 37}, (_, i) => addMonths(ym, i));
  // Carga de deudas: cuotas y créditos (las compras sin cuotas son gasto normal, no deuda a plazo)
  const entries = debtItems().filter(d => !d.single).flatMap(d => d.entries);
  const load = {}; months.forEach(m => load[m] = sumAmt(entries.filter(e => e.date.startsWith(m))));
  const savings = savingsRecs().reduce((a, s) => a + (+s.balance || 0), 0);
  const subsM = subsData().filter(s => s.active).reduce((a, s) => a + s.monthly, 0);
  return { inc: Math.round(inc), exp: Math.round(exp), surplus: Math.round(inc - exp), basis, load, savings, subsM: Math.round(subsM),
           debt: (debtSummary() || { debt: 0 }).debt, emergency: exp ? savings / exp : null };
}

/* ---------- recomendaciones para el mes siguiente ---------- */
function recommendations() {
  const nym = addMonths(ymNow(), 1), S0 = snapshot(), out = [];
  const add = (c, title, detail, impact) => out.push({ c, title, detail, impact });
  // Plan del mes siguiente
  const debtNext = S0.load[nym] || 0;
  const fixedNext = fixedRecs().filter(f => !f.debt && TIPOS[f.tipo].dir < 0).reduce((a, f) => a + fixedDates(f, dueOn(+nym.slice(0, 4), +nym.slice(5, 7), 31)).filter(d => d.startsWith(nym)).length * fixedCLP(f), 0);
  const incNext = fixedRecs().filter(f => TIPOS[f.tipo].dir > 0).reduce((a, f) => a + fixedDates(f, dueOn(+nym.slice(0, 4), +nym.slice(5, 7), 31)).filter(d => d.startsWith(nym)).length * fixedCLP(f), 0) || S0.inc;
  const varAvg = Math.max(S0.exp - S0.subsM - fixedNext, 0);
  const plan = { nym, inc: incNext, debt: debtNext, fixed: fixedNext, subs: S0.subsM, variable: varAvg, margin: incNext - debtNext - fixedNext - S0.subsM - varAvg };
  // Carga de deudas
  if (incNext) {
    const ratio = debtNext / incNext;
    if (ratio > 0.4) add('#B3261E', `Cuotas y créditos: ${Math.round(ratio * 100)}% de tus ingresos de ${monthOnly(nym)}`, 'Es una carga alta (sobre 40%). Evita nuevas compras en cuotas hasta que termine alguna y prioriza prepagar las que cobran interés.', debtNext);
    else if (ratio > 0.3) add('#C98A10', `Cuotas y créditos: ${Math.round(ratio * 100)}% de tus ingresos de ${monthOnly(nym)}`, 'Estás cerca del límite habitual de 30%. Antes de sumar cuotas nuevas, revisa cuánto se libera en los próximos meses.', debtNext);
  }
  // Cuotas que terminan
  const ending = debtItems().filter(d => !d.single && !d.open && d.end && d.end.startsWith(ymNow()));
  if (ending.length) add('#1D7A4C', `${ending.length} deuda${ending.length > 1 ? 's terminan' : ' termina'} este mes`, `Desde ${monthOnly(nym)} se liberan cerca de ${fmtCLP(ending.reduce((a, d) => a + d.vc, 0))} al mes. Puedes destinarlo a ahorro en vez de a nuevas cuotas.`, 0);
  // Categorías sobre lo habitual
  const cmp = catCompare(ymNow());
  cmp.rows.filter(r => r.trend >= 1 && r.avg >= 1 && !['Créditos y préstamos', 'Descuentos y retenciones', 'Transferencias'].includes(r.cat)).slice(0, 3).forEach(r => {
    const full = r.avg / (cmp.partial ? +today().slice(8, 10) / daysInMonth(ymNow()) : 1);
    add(CAT_COLORS[r.cat], `${r.cat}: ${r.label}`, `Llevas ${fmtCLP(r.v)} frente a ${fmtCLP(r.avg)} habitual a esta altura del mes. Para ${monthOnly(nym)}, un tope de ${fmtCLP(Math.round(full / 1000) * 1000)} te devuelve a tu nivel normal.`, Math.max(r.v - r.avg, 0));
  });
  // Presupuesto
  if (!Object.keys(budgets()).length && cmp.rows.length) add('#2F63A8', 'Define un presupuesto', `Empieza con tus 3 categorías principales: ${cmp.rows.slice(0, 3).map(r => r.cat).join(', ')}. La app te avisará al 80% y al 100%.`, 0);
  // Suscripciones que se superponen
  const act = subsData().filter(s => s.active);
  const groups = [
    ['asistentes de IA', /CHATGPT|CLAUDE|GEMINI|GOOGLE ONE|AI PRO|COPILOT|PERPLEXITY/],
    ['streaming de video', /NETFLIX|PRIME VIDEO|DISNEY|MAX|HBO|YOUTUBE|CRUNCHYROLL|APPLE TV/],
    ['almacenamiento en la nube', /DROPBOX|ICLOUD|GOOGLE ONE|ONEDRIVE|MICROSOFT 365/],
    ['audiolibros', /AUDIBLE|STORYTEL|KINDLE/]
  ];
  groups.forEach(([label, re]) => {
    const g = act.filter(s => re.test(norm(s.name)));
    if (g.length >= 2) add('#6B4FB3', `${g.length} suscripciones de ${label}`, `${g.map(s => s.name).join(', ')}: suman ${fmtCLP(g.reduce((a, s) => a + s.monthly, 0))} al mes. Revisa si usas todas.`, Math.min(...g.map(s => s.monthly)));
  });
  // Alzas de precio en suscripciones
  act.filter(s => s.items.length >= 2).forEach(s => {
    const [a, b] = s.items.slice(-2);
    if (a.currency === b.currency && b.amount > a.amount * 1.05) add('#6B4FB3', `${s.name} subió de precio`, `Pasó de ${a.currency === 'USD' ? fmtUSD(a.amount) : fmtCLP(a.amount)} a ${b.currency === 'USD' ? fmtUSD(b.amount) : fmtCLP(b.amount)}.`, clpNow(b) - clpNow(a));
  });
  // Costo de la tarjeta
  const C = cardCosts();
  if (C.prepay.length) { const x = C.prepay[0]; add('#7D2F2F', `Prepaga primero: ${x.name}`, `Cobra ${String(x.rate).replace('.', ',')}% mensual. Prepagarla (${fmtCLP(x.left)}) evita cerca de ${fmtCLP(x.interestLeft)} en intereses.`, x.interestLeft); }
  const seg = C.fees.find(f => /SEGURO/i.test(norm(f.name)));
  if (seg) add('#5E5E5E', 'Revisa el seguro de la tarjeta', `Pagas ${fmtCLP(seg.amt)} en el último período (${fmtCLP(seg.amt * 12)} al año). Si no lo necesitas, puedes pedir darlo de baja.`, seg.amt);
  if (C.feesMonth > 0) add('#5E5E5E', 'Comisiones e impuestos de la tarjeta', `Suman ${fmtCLP(C.feesMonth)} en el último período. La comisión de administración a veces se puede negociar o eximir por uso.`, 0);
  // Ahorro y fondo de emergencia
  if (plan.margin > 0) add('#1D7A4C', `Ahorra al inicio de ${monthOnly(nym)}`, `Tu margen estimado es ${fmtCLP(plan.margin)}. Apartar la mitad (${fmtCLP(Math.round(plan.margin / 2 / 1000) * 1000)}) apenas recibas tus ingresos hace más probable que el ahorro ocurra.`, Math.round(plan.margin / 2));
  else if (incNext) add('#B3261E', `Margen negativo para ${monthOnly(nym)}`, `Tus compromisos y gasto habitual superan tus ingresos estimados en ${fmtCLP(-plan.margin)}. Prioriza recortar gasto variable y no sumar cuotas nuevas.`, -plan.margin);
  if (S0.exp && S0.emergency != null && S0.emergency < 3) add('#2F63A8', 'Fondo de emergencia', `Tus ahorros registrados cubren ${S0.emergency.toFixed(1).replace('.', ',')} meses de gastos. Una meta habitual es de 3 a 6 meses (${fmtCLP(S0.exp * 3)} a ${fmtCLP(S0.exp * 6)}).`, 0);
  const pend = pendingList().length;
  if (pend > 15) add('#66716B', `${pend} movimientos por revisar`, 'Revisarlos mejora las categorías y hace más precisas estas recomendaciones.', 0);
  return { plan, list: out, basis: S0.basis };
}

/* ---------- consulta de compra ---------- */
function evaluatePurchase(q) {
  const S0 = snapshot();
  const P = q.price, n = q.mode === 'cuotas' ? Math.max(q.n || 1, 1) : 1, r = q.mode === 'cuotas' && q.interest ? (q.rate || 0) : 0;
  const cuota = Math.round(cuotaDe(P, n, r)), total = cuota * n, interest = Math.max(total - P, 0);
  const first = q.mode === 'cuotas' ? nextDueFor(q.card, today()) : today();
  const months = Array.from({length: n}, (_, j) => addToDate(first, j).slice(0, 7));
  const loadNow = months.map(m => S0.load[m] || 0);
  const peak = Math.max(...loadNow.map(v => v + (q.mode === 'cuotas' ? cuota : 0)), 0);
  const ratio = S0.inc ? peak / S0.inc : null;
  const reasons = [], tips = [];
  let level = 'na';
  if (!S0.inc) {
    reasons.push('Aún no hay ingresos registrados, así que no puedo medir cuánto pesa esta compra en tu presupuesto.');
  } else if (q.mode === 'cuotas') {
    reasons.push(`La cuota sería ${fmtCLP(cuota)} durante ${n} mes${n > 1 ? 'es' : ''}${interest ? `, con ${fmtCLP(interest)} de intereses en total` : ', sin intereses'}.`);
    reasons.push(`Con esta compra, tus cuotas y créditos llegarían a ${fmtCLP(peak)} en el mes más cargado: ${Math.round(ratio * 100)}% de tus ingresos (${S0.basis}).`);
    reasons.push(`Tu margen mensual habitual es ${fmtCLP(S0.surplus)}; la cuota ocuparía ${S0.surplus > 0 ? Math.round(cuota / S0.surplus * 100) + '%' : 'más de lo que te sobra'} de ese margen.`);
    if (ratio <= 0.30 && cuota <= 0.5 * Math.max(S0.surplus, 0)) level = 'ok';
    else if (ratio <= 0.40 && cuota <= Math.max(S0.surplus, 0)) level = 'mid';
    else level = 'no';
  } else {
    const after = S0.savings - P;
    reasons.push(`Pagar ${fmtCLP(P)} al contado equivale a ${S0.surplus > 0 ? (P / S0.surplus).toFixed(1).replace('.', ',') + ' meses de tu margen habitual' : 'más de lo que hoy te sobra cada mes'}.`);
    if (S0.savings) reasons.push(`Tus ahorros registrados quedarían en ${fmtCLP(after)}${S0.exp ? `, ${(Math.max(after, 0) / S0.exp).toFixed(1).replace('.', ',')} meses de gastos` : ''}.`);
    if (S0.surplus > 0 && P <= S0.surplus && (!S0.savings || after >= 3 * S0.exp)) level = 'ok';
    else if (S0.surplus > 0 && (P <= 2 * S0.surplus || after >= S0.exp)) level = 'mid';
    else level = 'no';
  }
  // Cómo hacerlo mejor
  if (S0.inc && S0.surplus > 0) {
    const opts = [3, 6, 10, 12, 18, 24, 36].filter(k => {
      const c = P / k;
      const pk = Math.max(...Array.from({length: k}, (_, j) => (S0.load[addToDate(nextDueFor(q.card, today()), j).slice(0, 7)] || 0) + c));
      return c <= 0.5 * S0.surplus && pk <= 0.30 * S0.inc;
    });
    if (opts.length) tips.push(`Si hay cuotas sin interés, desde ${opts[0]} cuotas (${fmtCLP(Math.round(P / opts[0]))} al mes) la compra queda dentro de rangos cómodos: cuota bajo la mitad de tu margen y cuotas totales bajo 30% de tus ingresos.`);
    if (r > 0) tips.push(`Con ${String(r).replace('.', ',')}% mensual pagarías ${fmtCLP(interest)} extra. Busca la opción sin interés o ahorra antes: apartando ${fmtCLP(Math.round(S0.surplus / 2))} al mes la juntas en ${Math.ceil(P / (S0.surplus / 2))} meses.`);
    if (q.mode === 'contado' && level !== 'ok') tips.push(`Ahorrando ${fmtCLP(Math.round(S0.surplus / 2))} al mes (la mitad de tu margen) juntarías el monto en ${Math.ceil(P / (S0.surplus / 2))} meses sin tocar tu colchón.`);
  }
  // ¿Cuándo se libera espacio?
  const startM = first.slice(0, 7), nowLoad = S0.load[startM] || 0;
  const freeM = Array.from({length: 18}, (_, i) => addMonths(startM, i + 1)).find(m => nowLoad - (S0.load[m] || 0) >= cuota);
  if (freeM && q.mode === 'cuotas' && level !== 'ok') tips.push(`En ${monthLong(freeM)} tus cuotas bajan en al menos ${fmtCLP(cuota)} frente a ${monthLong(startM)}. Si compras después de que terminen, la nueva cuota no aumentaría tu carga.`);
  if (q.mode === 'cuotas' && !r) tips.push('Si las cuotas son sin interés, pagar en cuotas en vez de al contado te deja más liquidez sin costo extra, siempre que no cobren comisión.');
  const title = { ok:'Se ve manejable', mid:'Posible, con cuidado', no:'No se ve recomendable ahora', na:'Faltan datos' }[level];
  return { level, title, reasons, tips, cuota, total, interest, first, S0 };
}

    if (!sub || a.querySelector('[data-cancel]')) return;
    const wrap = document.createElement('span'); wrap.className = 'act-r';
    const c = document.createElement('button'); c.type = 'button'; c.className = 'btn ghost'; c.textContent = 'Cancelar'; c.dataset.cancel = '1';
    sub.replaceWith(wrap); wrap.append(c, sub);
  });
  bg.addEventListener('click', e => { if (e.target.dataset.close || e.target.closest('[data-close-btn],[data-cancel]')) closeSheet(); });
  document.addEventListener('keydown', escClose);
  onMount && onMount(bg.querySelector('.sheet'));
  if (matchMedia('(pointer:fine)').matches) {
    const first = bg.querySelector('input:not([type=radio]):not([type=hidden]),select,textarea');
    first && setTimeout(() => first.focus({preventScroll:true}), 50);
  }
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }
function closeSheet() { $('#sheetHost').innerHTML = ''; document.removeEventListener('keydown', escClose); }

function saveTx(t, f) {
  const k = f.elements.tipo.value;
  const monto = Number(f.elements.monto.value);
  if (!(monto > 0)) { toast('Ingresa un monto mayor que cero.'); return; }
  const isNew = !t;
  const prevEff = isNew ? null : effTipo(t);
  t = t || { id: uid('m'), kind:'tx', source:'manual' };
  const d = TIPOS[k].dir;
  const cat = d === 0 ? '' : f.elements.category.value;
  const typedName = f.elements.name.value.trim();
  const autoName = isNew ? '' : (() => { const saved = t.name; t.name = ''; const n = displayName(t); t.name = saved; return n; })();

  t.tipo = k;
  if (!isNew && k !== prevEff) t.tipoLocked = true;
  t.currency = f.elements.currency.value;
  t.date = f.elements.date.value;
  t.bank = f.elements.bank.value || (t.source === 'manual' ? '' : t.bank);
  t.note = f.elements.note.value.trim();
  t.reviewed = true;
  t.category = cat;
  if (d < 0) t.sub = f.elements.sub.value === 'si' ? true : f.elements.sub.value === 'no' ? false : undefined;
  if (k === 'gasto' && f.elements.encuotas.value === 'si') {
    t.cuotas = Math.min(Math.max(Math.round(+f.elements.ncuotas.value) || 2, 2), 60);
    t.rate = f.elements.coninteres.value === 'si' ? (+f.elements.tasa.value || 0) : undefined;
    t.vc = +f.elements.vcuota.value || undefined;
    t.firstDue = f.elements.firstDue.value || undefined;
    t.card = f.elements.card.value || t.card;
  } else { t.cuotas = undefined; t.rate = undefined; t.vc = undefined; t.firstDue = undefined; }
  if (t.currency === 'USD' && !t.fx) t.fx = rate() || undefined;
  if (typedName && typedName !== autoName) t.name = typedName;

  // Sueldo con bruto u honorarios: el ingreso es el bruto y se crea el descuento en egresos.
  const childId = t.id + '_desc';
  let child = null;
  t.mode = undefined; t.net = undefined; t.amount = monto;
  if (k === 'ingreso' && cat === 'Sueldo' && Number(f.elements.bruto.value) > monto) {
    t.mode = 'sueldo'; t.amount = Number(f.elements.bruto.value); t.net = monto;
    child = { name:'Descuentos legales del sueldo', amount: t.amount - monto };
  } else if (k === 'ingreso' && cat === 'Turnos / honorarios' && f.elements.boleta.checked) {
    const pct = retencionDe(+t.date.slice(0, 4));
    const ret = Math.round(monto * pct / 100);
    t.mode = 'honorarios'; t.net = monto - ret; t.payer = f.elements.payer.value.trim() || undefined;
    child = { name:`Retención SII de la boleta (${String(pct).replace('.', ',')}%)`, amount: ret };
  }
  if (child) put({ ...(S.recs[childId] || {}), id: childId, kind:'tx', source:'auto', parent: t.id, tipo:'descuento', tipoLocked:true,
                   category:'Descuentos y retenciones', name: child.name, amount: child.amount, currency:'CLP', date: t.date, reviewed:true, deleted:false });
  else if (S.recs[childId] && !S.recs[childId].deleted) removeRec(childId);

  put(t);
  if (f.elements.rule && f.elements.rule.checked && (t.rawName || t.counterparty)) {
    const match = matchKey(t.rawName || t.counterparty);
    const existing = userRules().find(r => r.match === match && r.amount == null);
    put({ ...(existing || { id: uid('ru'), kind:'rule', match }), name: displayName(t), category: cat || undefined, sub: t.sub,
          tipo: ['interna', 'pago_tarjeta'].includes(k) ? k : undefined });
  }
  dedupPass();
  closeSheet(); render();
  toast(isNew ? 'Movimiento agregado.' : 'Cambios guardados.');
  checkBudgetAlerts();
}

function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.onload = res;
    s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Conéctate a internet una vez para descargarlo, o usa un CSV.'));
    document.head.appendChild(s);
  });
}
function parseCSV(txt) {
  const first = txt.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  return txt.split(/\r?\n/).map(line => {
    const out = []; let cur = '', q = false;
    for (const ch of line) {
      if (ch === '"') q = !q;
      else if (ch === sep && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(c => c.trim());
  });
}
function cellNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/[$\sCLP]/gi, '');
  if (!s) return 0;
  const neg = /^-|^\(.*\)$/.test(s);
  s = s.replace(/[()-]/g, '').replace(/,\d{1,2}$/, '').replace(/[.,]/g, '');
  const n = Number(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function cellDate(v) {
  if (v instanceof Date && !isNaN(v)) return isoOf(v);
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v || '').trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function findHeader(rows) {
  let best = 0, bestScore = -1;
  rows.slice(0, 40).forEach((r, i) => {
    const txt = norm(r.join(' '));
    const sc = ['FECHA', 'DESCRIP', 'DETALLE', 'GLOSA', 'CARGO', 'ABONO', 'MONTO', 'MOVIMIENTO'].filter(k => txt.includes(k)).length;
    if (sc > bestScore) { bestScore = sc; best = i; }
  });
  return best;
}

async function importCartola(file, bank) {
  let rows;
  try {
    if (/\.csv$/i.test(file.name)) rows = parseCSV(await file.text());
    else {
      await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
    }
  } catch (e) { toast(e.message); return; }
  const hi = findHeader(rows);
  const header = (rows[hi] || []).map(c => String(c).trim());
  const saved = S.settings.cartolaMaps[bank] || {};
  const guess = re => { const i = header.findIndex(h => re.test(norm(h))); return i; };
  const map = {
    fecha: saved.fecha ?? guess(/FECHA/),
    desc: saved.desc ?? guess(/DESCRIP|DETALLE|GLOSA|MOVIMIENTO|CONCEPTO/),
    cargo: saved.cargo ?? guess(/CARGO|DEBE|EGRESO|GIRO/),
    abono: saved.abono ?? guess(/ABONO|HABER|INGRESO|DEPOSITO/),
    monto: saved.monto ?? guess(/^MONTO|IMPORTE/)
  };
  const opt = sel => `<option value="-1">No usar</option>` + header.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h || 'Columna ' + (i + 1))}</option>`).join('');
  const preview = rows.slice(hi, hi + 5).map(r => `<tr>${r.slice(0, 8).map(c => `<td>${esc(c instanceof Date ? isoOf(c) : c)}</td>`).join('')}</tr>`).join('');
  openSheet('Columnas de la cartola', `
    <p class="calc">Revisa qué columna corresponde a cada dato. Se recuerda para la próxima cartola de ${esc(BANKS[bank])}.</p>
    <div class="map-table"><table>${preview}</table></div>
    <form class="form" id="mapForm" style="margin-top:14px">

/* Filas de cartola de cuenta (Excel/CSV con columnas elegidas) → {d, desc, out, in} */
function cartolaRowsFromTable(rows, m) {
  const out = [];
  rows.forEach(r => {
    const d = cellDate(r[m.fecha]);
    if (!d) return;
    const desc = m.desc > -1 ? String(r[m.desc] || '').trim() : '';
    let inAmt = 0, outAmt = 0;
    if (m.cargo > -1 || m.abono > -1) {
      outAmt = m.cargo > -1 ? Math.abs(cellNum(r[m.cargo])) : 0;
      inAmt = m.abono > -1 ? Math.abs(cellNum(r[m.abono])) : 0;
    } else { const v = cellNum(r[m.monto]); if (v < 0) outAmt = -v; else inAmt = v; }
    if (inAmt || outAmt) out.push({ d, desc, out: outAmt, in: inAmt });
  });
  return out;
}
/* Convierte filas de cartola en movimientos, con tipo: ingreso, gasto, transferencia, pago de tarjeta o entre mis cuentas */
function cartolaRecs(list, bank) {
  const seen = {};
  return list.map(r => {
    const amount = r.in || r.out, nd = norm(r.desc).replace(/[.*]/g, ' ');
    let tipo;
    if (r.in) tipo = /TRANSF|TRASPASO|TEF\b|DEPOSITO/.test(nd) ? 'transfer_in' : 'ingreso';
    else if (CARDPAY_RE.test(nd)) tipo = 'pago_tarjeta';
    else if (/TRANSF|TRASPASO|TEF\b/.test(nd)) tipo = 'transfer_out';
    else tipo = 'gasto';
    if (INTERNAL_RE.test(nd) && (tipo === 'transfer_in' || tipo === 'transfer_out' || tipo === 'ingreso')) tipo = r.in ? 'transfer_in' : 'transfer_out';
    const base = `ct_${bank}_${r.d}_${amount}_${matchKey(r.desc).slice(0, 24).replace(/\s/g, '')}`;
    seen[base] = (seen[base] || 0) + 1;
    const isTransfer = tipo === 'transfer_in' || tipo === 'transfer_out';
    const rec = { id: base + '_' + seen[base], kind:'tx', source:'cartola', bank, tipo, amount, currency:'CLP', date: r.d,
                  rawName: isTransfer ? '' : r.desc.slice(0, 60),
                  counterparty: isTransfer ? r.desc.replace(/^(TRANSF(ERENCIA)?|TRASPASO|TEF)\s*(DE FONDOS)?\s*(DE|A|DESDE|PARA)?\s*:?\s*/i, '').slice(0, 60) : '', reviewed:false };
    if (tipo === 'ingreso' && /REMUNERACION|SUELDO|NOMINA|HONORARIO/.test(nd)) rec.category = 'Sueldo';
    return rec;
  });
}
function commitCartola(list, bank) {
  if (!list.length) return { total: 0, removed: 0 };
  const dates = list.map(r => r.d).sort();
  const res = replacePeriod(t => t.source === 'cartola' && t.bank === bank, dates[0], dates[dates.length - 1], cartolaRecs(list, bank));
  logImport(`Cartola ${BANKS[bank] || bank}, ${dmy(dates[0])} al ${dmy(dates[dates.length - 1])}`, res.snapshot, res.total);
  dedupPass();
  return res;
}
function ingestCartola(rows, m, bank) {
  const res = commitCartola(cartolaRowsFromTable(rows, m), bank);
  return { added: res.total, dups: 0, skipped: res.replacedBefore };
}

/* Cartola de cuenta en PDF: tabla con Fecha, Descripción, Cargos/Abonos (o Monto) y Saldo */
function parseAccountRows(rows) {
  let cols = null, cur = null;
  const recs = [];
  const colOf = x => { let c = null; cols.forEach(h => { if (h.x <= x + 6) c = h.key; }); return c; };
  const all = rows.map(rowText).join(' ');
  const yearHint = (all.match(/\b\d{2}\/\d{2}\/(\d{4})\b/) || [])[1] || today().slice(0, 4);
  rows.forEach(r => {
    const txt = rowText(r);
    if (/\bFecha\b/i.test(txt) && (/(Cargo|D[ée]bito|Giro|Egreso)/i.test(txt) || /Monto/i.test(txt)) && /(Abono|Cr[ée]dito|Dep[óo]sito|Ingreso|Saldo)/i.test(txt)) {
      cols = r.parts.map(q => {
        const t = norm(q.s);
        const key = /^FECHA/.test(t) ? 'fecha' : /(DESCRIP|DETALLE|GLOSA|MOVIMIENTO|CONCEPTO)/.test(t) ? 'desc' : /(CARGO|DEBITO|GIRO|EGRESO)/.test(t) ? 'cargo'
          : /(ABONO|CREDITO|DEPOSITO|INGRESO)/.test(t) ? 'abono' : /SALDO/.test(t) ? 'saldo' : /MONTO/.test(t) ? 'monto' : 'otro';
        return { x: q.x, key };
      });
      if (!cols.some(c => c.key === 'desc')) { const f = cols.findIndex(c => c.key === 'fecha'); if (cols[f + 1]) cols[f + 1].key = 'desc'; }
      return;
    }
    if (!cols) return;
    const cells = {};
    r.parts.forEach(q => { const k = colOf(q.x); if (k) cells[k] = ((cells[k] || '') + ' ' + q.s).trim(); });
    const fm = String(cells.fecha || '').match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
    if (fm && (cells.cargo || cells.abono || cells.monto)) {
      let y = fm[3] ? +fm[3] : +yearHint; if (y < 100) y += 2000;
      cur = { d: `${y}-${pad(fm[2])}-${pad(fm[1])}`, desc: cells.desc || '', cells };
      recs.push(cur);
    } else if (cur && cells.desc && !cells.fecha) cur.desc += ' ' + cells.desc;
  });
  return recs.map(r => {
    const c = r.cells;
    let outA = c.cargo ? Math.abs(cellNum(c.cargo)) : 0, inA = c.abono ? Math.abs(cellNum(c.abono)) : 0;
    if (!c.cargo && !c.abono && c.monto) { const v = cellNum(c.monto); if (v < 0) outA = -v; else inA = v; }
    return { d: r.d, desc: scrubCard(r.desc).replace(/\s+/g, ' ').trim(), out: outA, in: inA };
  }).filter(r => r.out || r.in);
}
function reviewAccountCartola(list, bank) {
  const dates = list.map(r => r.d).sort();

      <label class="f">Banco de la cuenta<select class="in" name="bank">${Object.entries(BANKS).map(([k, v]) => `<option value="${k}" ${k === bank ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <p class="notice">Esta cartola pasa a ser la base de ese período: reemplaza lo que cargaste antes desde cartolas de la misma cuenta entre esas fechas, así no se duplica. Las transferencias entre tus cuentas y los pagos de tarjeta no se cuentan como gasto.</p>

/* =====================================================================
   Deudas: compras en cuotas (estados de cuenta) y créditos
   ===================================================================== */
const statements = () => Object.values(S.recs).filter(r => r.kind === 'card_statement' && alive(r));
const loans = () => Object.values(S.recs).filter(r => r.kind === 'debt' && alive(r)).sort((a, b) => a.name.localeCompare(b.name));
function latestStatements() {
  const m = {};
  statements().forEach(st => { if (!m[st.card] || st.date > m[st.card].date) m[st.card] = st; });
  return Object.values(m).sort((a, b) => cardLabel(a.card).localeCompare(cardLabel(b.card)));
}
const activeItems = st => (st.items || []).filter(i => i.on && !i.sub);
/* Movimientos no facturados: valen mientras no llegue un estado de cuenta más nuevo de esa tarjeta */
function activeUnbilled() {
  const billed = {};
  latestStatements().forEach(st => billed[st.card] = st.to || st.date);
  // Lo que ya quedó dentro de un estado de cuenta facturado se descarta de los no facturados
  return Object.values(S.recs).filter(r => r.kind === 'card_unbilled' && alive(r) && !(billed[r.card] && billed[r.card] >= r.date))
    .map(r => billed[r.card] ? { ...r, items: (r.items || []).map(i => i.d <= billed[r.card] ? { ...i, on: false } : i) } : r);
}
const stDue = st => st.due || st.date;
const itemCLP = i => i.cur === 'USD' ? Math.round(i.vc * (rate() || 0)) : i.vc;

/* Fechas de pago de cada cuota. La cuota k vence en la fecha de pago del estado de cuenta;
   las siguientes, un mes después cada una. Una cuota 00/03 parte el mes siguiente. */
function itemEntries(i, st) {
  const D = stDue(st), amt = itemCLP(i);
  if (i.n <= 1) return [{ date: D, amt }];
  const out = [];
  for (let j = Math.max(i.k, 1); j <= i.n; j++) out.push({ date: addToDate(D, j - i.k), amt });
  return out;
}
/* Fecha con el día de pago elegido, ajustada al último día si el mes es más corto */
function dueOn(y, m, d) {
  const dt = new Date(y, m - 1, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(Math.min(d, last))}`;
}
function loanEntries(l) {
  const amt = l.currency === 'UF' ? Math.round(l.vc * ((S.settings.rates && S.settings.rates.uf) || 0)) : l.vc;
  const y0 = +l.firstDue.slice(0, 4), m0 = +l.firstDue.slice(5, 7), d = l.day || +l.firstDue.slice(8, 10);
  return Array.from({length: l.n}, (_, j) => ({ date: dueOn(y0, m0 + j, d), amt }));
}
const sumAmt = a => a.reduce((s, e) => s + e.amt, 0);
const stThisPayment = st => sumAmt(activeItems(st).flatMap(i => itemEntries(i, st)).filter(e => e.date === stDue(st)));
const stDebt = st => sumAmt(activeItems(st).flatMap(i => itemEntries(i, st)));

/* Cuota con interés mensual r% (sistema francés); sin interés = monto / n */
function cuotaDe(P, n, r) {
  if (!(n > 0)) return P;
  const i = (r || 0) / 100;
  return i > 0 ? P * i / (1 - Math.pow(1 + i, -n)) : P / n;
}
/* Próxima fecha de pago de la tarjeta para una compra hecha en «date», según su último estado de cuenta */
function nextDueFor(card, date) {
  const sts = latestStatements();
  const st = sts.find(x => x.card === card) || sts[0];
  const d = date || today();
  if (st && st.due) {
    const cut = +st.date.slice(8, 10), dueDay = +st.due.slice(8, 10);
    const gap = (+st.due.slice(0, 4) * 12 + +st.due.slice(5, 7)) - (+st.date.slice(0, 4) * 12 + +st.date.slice(5, 7));
    const m = +d.slice(5, 7) + (+d.slice(8, 10) > cut ? 1 : 0);
    return dueOn(+d.slice(0, 4), m + gap, dueDay);
  }
  return dueOn(+d.slice(0, 4), +d.slice(5, 7) + 1, 10);
}
/* ¿Esta compra en cuotas ya aparece en un estado de cuenta o en los no facturados? Entonces manda el documento. */
function txCovered(t) {
  return [...latestStatements(), ...activeUnbilled()].some(st => (st.items || []).some(i =>
    i.n > 1 && (i.cur || 'CLP') === (t.currency || 'CLP') && Math.abs((i.mo || i.vc * i.n) - t.amount) <= Math.max(2, t.amount * 0.005) &&
    Math.abs(daysBetween(i.d, t.date)) <= 4));
}
function txEntries(t) {
  const vcRaw = t.vc || cuotaDe(t.amount, t.cuotas, t.rate || 0);
  const amt = t.currency === 'USD' ? Math.round(vcRaw * (t.fx || rate() || 0)) : Math.round(vcRaw);
  const first = t.firstDue || nextDueFor(t.card, t.date);
  return Array.from({length: t.cuotas}, (_, j) => ({ date: addToDate(first, j), amt }));
}

/* Estado de cada deuda a la fecha de hoy: cuotas pagadas se estiman por las fechas de pago ya pasadas */
function debtItems() {
  const t = today(), out = [];
  [...latestStatements(), ...activeUnbilled()].forEach(st => (st.items || []).forEach((i, idx) => {
    if (!i.on || i.sub) return;
    const e = itemEntries(i, st);
    out.push({ type:'cuota', sid: st.id, idx, name: itemName(i), where: cardLabel(st.card) + (st.kind === 'card_unbilled' ? ', sin facturar' : ''), card: st.card, n: Math.max(i.n, 1), vc: itemCLP(i), usd: i.cur === 'USD' ? i.vc : null,
               paid: Math.max(i.k - 1, 0) + e.filter(x => x.date <= t).length, entries: e, end: e[e.length - 1].date,
               left: sumAmt(e.filter(x => x.date > t)), single: i.n <= 1 });
  }));
  // Compras en cuotas registradas en Movimientos que aún no aparecen en un estado de cuenta
  allTx().filter(x => x.cuotas > 1 && !x.dupOf && dir(x) < 0 && !txCovered(x)).forEach(x => {
    const e = txEntries(x);
    out.push({ type:'tx', id: x.id, name: displayName(x), where: x.card ? cardLabel(x.card) : 'Registrada en Movimientos', card: x.card, n: x.cuotas,
               vc: e[0].amt, usd: x.currency === 'USD' ? (x.vc || cuotaDe(x.amount, x.cuotas, x.rate || 0)) : null,
               paid: e.filter(y => y.date <= t).length, entries: e, end: e[e.length - 1].date, left: sumAmt(e.filter(y => y.date > t)), single: false });
  });
  // Movimientos fijos marcados como pago de deuda
  fixedRecs().filter(f => f.debt && TIPOS[f.tipo].dir < 0).forEach(f => {
    const e = fixedDates(f, f.end || addToDate(t, 12)).map(date => ({ date, amt: fixedCLP(f) }));
    if (!e.length) return;
    out.push({ type:'fixed', id: f.id, name: f.name, where: 'Pago mensual', n: f.end ? e.length : 0, vc: fixedCLP(f), uf: f.currency === 'UF' ? f.amount : null,
               paid: e.filter(x => x.date <= t).length, entries: e, end: f.end || '', open: !f.end,
               left: f.end ? sumAmt(e.filter(x => x.date > t)) : 0, single: false });
  });
  loans().forEach(l => {
    const e = loanEntries(l);
    out.push({ type:'loan', id: l.id, name: l.name, where: l.lender || '', n: l.n, vc: e[0] ? e[0].amt : 0, uf: l.currency === 'UF' ? l.vc : null,
               paid: e.filter(x => x.date <= t).length, entries: e, end: e.length ? e[e.length - 1].date : t,
               left: sumAmt(e.filter(x => x.date > t)), single: false });
  });
  return out;
}
function debtSummary() {
  const items = debtItems();
  if (!items.length) return null;
  const t = today();
  const future = items.flatMap(d => d.entries).filter(e => e.date > t).sort((a, b) => a.date.localeCompare(b.date));
  const nextYm = future.length ? future[0].date.slice(0, 7) : '';
  return { debt: items.reduce((a, d) => a + d.left, 0), next: sumAmt(future.filter(e => e.date.startsWith(nextYm))), nextYm };
}
function monthlyPayments(n) {
  const months = Array.from({length:n}, (_, i) => addMonths(ymNow(), i));
  const all = debtItems().flatMap(d => d.entries);
  return { months, vals: months.map(m => sumAmt(all.filter(e => e.date.startsWith(m)))) };
}

const isFee = i => /\b(COMISION|IMPUESTO DECRETO|SEGURO|INTERESES?|MANTENCION|CARGO POR|ADMINISTRACION)/.test(norm(i.desc));
function cardCosts() {
  const out = { has:false, interestMonth:0, interestLeft:0, feesMonth:0, fees:[], prepay:[] };
  const feeMap = {};
  latestStatements().forEach(st => (st.items || []).forEach((i, idx) => {
    if (!i.on) return;
    if (isFee(i) && i.n <= 1) {
      const name = itemName(i);
      feeMap[name] = feeMap[name] || { name, amt:0, n:0 };
      feeMap[name].amt += itemCLP(i); feeMap[name].n++; out.feesMonth += itemCLP(i); out.has = true;
      return;
    }
    if (i.n > 1 && i.tp > i.mo) {
      const interest = i.tp - i.mo, leftN = Math.max(i.n - paidOf(i, st), 0);
      out.interestMonth += Math.round(interest / i.n);
      const il = Math.round(interest * leftN / i.n);
      out.interestLeft += il; out.has = true;
      if (leftN > 0) out.prepay.push({ name: itemName(i), rate: i.rate || 0, left: itemCLP(i) * leftN, interestLeft: il, sid: st.id, idx });
    }
  }));
  out.fees = Object.values(feeMap).sort((a, b) => b.amt - a.amt);
  out.prepay.sort((a, b) => b.rate - a.rate || b.interestLeft - a.interestLeft);
  return out;
}

function itemName(i) {
  if (i.name) return i.name;
  const r = ruleFor({ rawName: i.desc, tipo:'gasto', amount: i.vc, currency: i.cur || 'CLP' });
  return (r && r.name) || cleanName(i.desc) || i.desc;
}
/* ¿Es una suscripción? Se excluye porque ya se cuenta en Suscripciones. */
function itemIsSub(desc, vc, n) {
  if (n > 1) return false;
  const r = ruleFor({ rawName: desc, tipo:'gasto', amount: vc, currency:'CLP', date: today() });
  if (r && r.sub === true) return true;
  const key = matchKey(desc);
  if (recurringKeys().has(key)) return true;
  return subsData().some(sd => sd.active && matchKey(sd.name).length >= 4 && key.includes(matchKey(sd.name)));
}

const monthYear = s => { const t = dateOfYm(s.slice(0, 7)).toLocaleDateString('es-CL', {month:'short', year:'numeric'}).replace('.', ''); return t; };

  const row = d => {

      <div class="dl-meta"><span>Pagos hechos: ${d.paid}</span><span>Sin fecha de término</span></div></li>`;
    const pct = Math.round(d.paid / d.n * 100);
    const vcTxt = d.usd != null ? fmtUSD(d.usd) : d.uf != null ? `UF ${d.uf.toLocaleString('es-CL')}` : fmtCLP(d.vc);
    return `<li tabindex="0" class="click" ${d.type === 'loan' ? `data-loan="${esc(d.id)}"` : d.type === 'fixed' ? `data-fixed-debt="${esc(d.id)}"` : d.type === 'tx' ? `data-txd="${esc(d.id)}"` : `data-debt="${esc(d.sid)}:${d.idx}"`} aria-label="Editar ${esc(d.name)}">

      </div></fieldset>
      <label class="f">Nombre<input type="text" name="name" required value="${esc(f ? f.name : '')}" placeholder="Ej.: Transferencia a mi familia"></label>
      <div class="row2">

        <label class="f">Moneda<select class="in" name="currency"><option value="CLP">CLP</option><option value="UF" ${f && f.currency === 'UF' ? 'selected' : ''}>UF</option></select></label>

      <label class="f">Banco (opcional)<select class="in" name="bank"><option value="">Sin banco</option>${Object.entries(BANKS).map(([k, v]) => `<option value="${k}" ${f && f.bank === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <label class="chk" id="fxDebtRow"><input type="checkbox" name="debt" ${f && f.debt ? 'checked' : ''}>Es el pago de una deuda (mostrar cuotas pagadas en Deudas)</label>

      const draft = { start: el.start.value || today(), end: el.end.value };
      if (!el.start.value) { $('#fxPrev', sh).textContent = ''; return; }
      const all = draft.end ? fixedDates(draft, '9999-12-31').length : null;
      const done = fixedDates(draft, today()).length;
      const amt = +el.amount.value || 0;
      const unit = el.currency.value === 'UF' ? v => 'UF ' + v.toLocaleString('es-CL', {maximumFractionDigits:2}) : fmtCLP;
      $('#fxPrev', sh).textContent = all != null
        ? `${all} pagos mensuales en total; ${done} ya pasaron. Quedan ${all - done}: ${unit(amt * (all - done))}.`

    };
    upd();
    fm.addEventListener('change', upd); fm.addEventListener('input', e => { if (e.target.name !== 'name') upd(); });

      e.preventDefault();
      if (el.end.value && el.end.value < el.start.value) { toast('El último pago no puede ser antes del primero.'); return; }
      const d = TIPOS[el.tipo.value].dir;
      put({ ...(f || { id: uid('fx'), kind:'fixed' }), tipo: el.tipo.value, name: el.name.value.trim(), amount: +el.amount.value, currency: el.currency.value,
            category: el.category.value, start: el.start.value, end: el.end.value || '', bank: el.bank.value, debt: d < 0 && el.debt.checked });
      const n = materializeFixed(); dedupPass();
      closeSheet(); render(); toast(n ? `Guardado. Se registraron ${n} pago${n > 1 ? 's' : ''} ya ocurrido${n > 1 ? 's' : ''}.` : 'Movimiento fijo guardado.');

      if (!e.target.closest('[data-act="del-fixed"]')) return;
      if (!confirm('¿Eliminar este movimiento fijo? Los pagos ya registrados se mantienen; no se crearán nuevos.')) return;
      removeRec(f.id); closeSheet(); render(); toast('Movimiento fijo eliminado.');
    });
  });
}

/* ---------- corregir una compra del estado de cuenta ---------- */
/* Cuántas fechas de pago mensuales (desde D) ya pasaron a hoy */
function passedSince(D) {
  const t = today(); let m = 0;
  while (m < 600 && addToDate(D, m) <= t) m++;
  return m;
}
const paidOf = (i, st) => Math.max(i.k - 1, 0) + itemEntries(i, st).filter(e => e.date <= today()).length;

function openItemEditor(sid, idx) {
  const st = S.recs[sid];
  if (!st || !st.items || !st.items[idx]) return;
  const i = st.items[idx];
  const usd = i.cur === 'USD';
  const fmt = v => usd ? fmtUSD(v) : fmtCLP(v);
  const monto = i.mo || i.vc * Math.max(i.n, 1);
  openSheet('Corregir deuda', `
    <form class="form" id="itForm">
      <p class="calc">${esc(i.desc)} (${dmy(i.d)}, ${esc(cardLabel(st.card))})</p>
      <label class="f">Nombre<input type="text" name="name" value="${esc(itemName(i))}"></label>
      <label class="f">Monto total de la compra${usd ? ' (US$)' : ''}<input type="number" name="mo" inputmode="decimal" step="any" min="0" required value="${esc(monto)}"></label>
      <fieldset style="border:0;padding:0;margin:0"><legend class="vh">¿Tiene cuotas?</legend><div class="types">
        <label><input type="radio" name="cq" value="no" ${i.n <= 1 ? 'checked' : ''}>Sin cuotas</label>
        <label><input type="radio" name="cq" value="si" ${i.n > 1 ? 'checked' : ''}>En cuotas</label>
      </div></fieldset>
      <div id="cqBox" class="form">
        <div class="row2" style="grid-template-columns:1fr 1fr">
          <label class="f">Total de cuotas<input type="number" name="n" min="2" max="60" value="${esc(i.n > 1 ? i.n : 3)}"></label>
          <label class="f">Cuotas ya pagadas<input type="number" name="paid" min="0" value="${esc(i.n > 1 ? paidOf(i, st) : 0)}"></label>
        </div>
        <label class="f">Valor de la cuota${usd ? ' (US$)' : ''}<small id="vcHint">Calculado como monto dividido por cuotas, sin intereses. Puedes cambiarlo.</small><input type="number" name="vc" inputmode="decimal" step="any" min="0" value="${esc(i.n > 1 ? i.vc : '')}"></label>
      </div>
      <p class="notice" id="itPrev"></p>
      <label class="chk"><input type="checkbox" name="sub" ${i.sub ? 'checked' : ''}>Es una suscripción (no contarla como deuda)</label>
      <div class="actions"><button type="button" class="btn danger" data-act="item-off">Quitar de deudas</button><button class="btn" type="submit">Guardar</button></div>
    </form>`, sh => {
    const f = $('#itForm', sh), el = f.elements;
    let vcTouched = i.n > 1 && Math.abs(i.vc - Math.round(monto / i.n)) > 1;
    const draft = () => {
      const mo = +el.mo.value || 0, cuotas = el.cq.value === 'si';
      const n = cuotas ? Math.min(Math.max(Math.round(+el.n.value) || 2, 2), 60) : 1;
      if (cuotas && !vcTouched) el.vc.value = usd ? (mo / n).toFixed(2) : Math.round(mo / n);
      const vc = cuotas ? (+el.vc.value || 0) : mo;
      const paid = cuotas ? Math.min(Math.max(Math.round(+el.paid.value) || 0, 0), n) : 0;
      // Se ubica la cuota de modo que, según las fechas de pago, hoy vayan "paid" pagadas.
      const k = cuotas ? paid - passedSince(stDue(st)) + 1 : 1;
      return { ...i, name: el.name.value.trim(), mo, n, vc, k, sub: el.sub.checked };
    };
    const upd = () => {
      $('#cqBox', sh).classList.toggle('hide', el.cq.value !== 'si');
      const d = draft();
      const e = itemEntries(d, st), t = today();
      const left = e.filter(x => x.date > t);
      $('#itPrev', sh).textContent = d.n > 1
        ? `Pagadas ${paidOf(d, st)} de ${d.n}. Quedan ${left.length} cuota${left.length === 1 ? '' : 's'} de ${fmt(d.vc)}: ${fmtCLP(sumAmt(left))}. ${left.length ? 'Termina en ' + monthYear(e[e.length - 1].date) + '.' : 'Ya está pagada.'}`
        : `Se paga completa en el estado de cuenta: ${fmt(d.vc)}.`;
    };
    el.vc.addEventListener('input', () => { vcTouched = el.vc.value !== ''; });
    ['mo', 'n'].forEach(k => el[k].addEventListener('input', () => { if (!el.vc.matches(':focus')) vcTouched = vcTouched && el.vc.value !== ''; upd(); }));
    f.addEventListener('input', upd); f.addEventListener('change', upd);
    upd();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const d = draft();
      if (!(d.vc > 0)) { toast('Ingresa un valor de cuota mayor que cero.'); return; }
      const items = st.items.slice();
      items[idx] = { ...d, name: d.name && d.name !== itemName({ ...i, name:'' }) ? d.name : undefined, on: true, edited: true };
      put({ ...st, items });
      closeSheet(); render(); toast('Deuda actualizada.');
    });
    sh.addEventListener('click', e => {
      if (!e.target.closest('[data-act="item-off"]')) return;
      if (!confirm('¿Quitar este cargo de tus deudas? Puedes volver a marcarlo en «Revisar cargos».')) return;
      const items = st.items.slice(); items[idx] = { ...i, on: false }; put({ ...st, items });
      closeSheet(); render(); toast('Cargo quitado de deudas.');
    });
  });
}

      $('#lnPrev', sh).textContent = n && vc ? `Quedan ${n - paid} cuota${n - paid === 1 ? '' : 's'} de ${unit(vc)}: ${unit(vc * (n - paid))} por pagar.` : 'Completa las cuotas y su valor para ver el resumen.';
    };
    f.addEventListener('input', updL); f.addEventListener('change', updL); updL();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const el = f.elements;
      const n = Math.round(+el.n.value), paid = Math.min(Math.round(+el.paid.value), n), d = Math.min(Math.max(Math.round(+el.day.value), 1), 31);
      // Próxima fecha de pago: el día elegido de este mes si aún no pasa; si no, el del mes siguiente.
      const yy = +t.slice(0, 4), mm = +t.slice(5, 7);
      const nextM = dueOn(yy, mm, d) > t ? mm : mm + 1;
      // Las cuotas ya pagadas quedan en los meses anteriores a esa fecha.
      const firstDue = dueOn(yy, nextM - paid, d);
      put({ ...(l || { id: uid('db'), kind:'debt' }), name: el.name.value.trim(), lender: el.lender.value.trim(), vc: +el.vc.value, total: +el.total.value || undefined, currency: el.currency.value, n, day: d, firstDue });
      closeSheet(); render(); toast('Crédito guardado.');
    });
    sh.addEventListener('click', e => { if (e.target.closest('[data-act="del-loan"]') && confirm('¿Eliminar este crédito?')) { removeRec(l.id); closeSheet(); render(); } });
  });
}

function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(sc => sc.src === src)) return res();
    const sc = document.createElement('script');
    sc.src = src; sc.onload = res;
    sc.onerror = () => rej(new Error('No se pudo cargar el lector. Conéctate a internet una vez para descargarlo.'));
    document.head.appendChild(sc);
  });
}

let pdfWorkerUrl = null;
async function pdfRows(file) {
  await loadScript(PDFJS_URL);
  if (!pdfWorkerUrl) {
    // El navegador no permite crear un worker desde otro dominio: se descarga y se usa como blob.
    const r = await fetch(PDFJS_WORKER);
    if (!r.ok) throw new Error('No se pudo cargar el lector de PDF.');
    pdfWorkerUrl = URL.createObjectURL(new Blob([await r.text()], { type:'text/javascript' }));
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = pdfWorkerUrl;
  const task = pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) });
  task.onPassword = (update, reason) => {
    const pw = prompt(reason === 2 ? 'Clave incorrecta. Intenta de nuevo:' : 'Este PDF tiene clave (muchos bancos usan tu RUT sin puntos ni dígito verificador). La clave no se guarda:');
    if (pw == null) task.destroy(); else update(pw);
  };
  const pdf = await task.promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let r = rows.find(q => Math.abs(q.y - y) < 2.5);
      if (!r) { r = { y, parts: [] }; rows.push(r); }
      r.parts.push({ x, s: it.str });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => { r.parts.sort((a, b) => a.x - b.x); out.push(r); });
  }
  return out;
}
const rowText = r => r.parts.map(q => q.s).join(' ').replace(/\s+/g, ' ').trim();
async function pdfLines(file) { return (await pdfRows(file)).map(rowText); }

/* ---------- «Saldo y movimientos no facturados» (tabla por columnas) ---------- */
function parseUnbilledRows(rows) {
  let cols = null, usd = false;
  const recs = [];
  let cur = null;
  const colOf = x => { let c = null; cols.forEach(h => { if (h.x <= x + 6) c = h.key; }); return c; };
  rows.forEach(r => {
    const txt = rowText(r);
    if (/^Fecha\b/i.test(txt) && /Descripci/i.test(txt) && /Monto/i.test(txt)) {
      cols = r.parts.map(q => ({ x: q.x, key: /^Fecha/i.test(q.s) ? 'fecha' : /^Tipo/i.test(q.s) ? 'tipo' : /^Descrip/i.test(q.s) ? 'desc'
        : /^Cuota/i.test(q.s) ? 'cuotas' : /^Monto/i.test(q.s) ? 'monto' : 'otro' }));
      usd = /USD|US\$/i.test(txt);
      return;
    }
    if (!cols) return;
    const cells = {};
    r.parts.forEach(q => { const k = colOf(q.x); if (k && k !== 'tipo') cells[k] = ((cells[k] || '') + ' ' + q.s).trim(); });
    if (cells.fecha && /^\d{2}\/\d{2}\/\d{4}$/.test(cells.fecha) && cells.monto) { cur = cells; recs.push(cur); }
    else if (cur && cells.desc && !cells.fecha && !cells.monto) cur.desc += ' ' + cells.desc;   // descripción en dos líneas
  });
  const items = recs.map(c => {
    const [dd, mm, yy] = c.fecha.split('/');
    const raw = String(c.monto).replace(/\s/g, '');
    const v = usd ? Number(raw.replace(/\./g, '').replace(',', '.')) : Number(raw.replace(/[.,]/g, ''));
    if (!isFinite(v) || !v) return null;
    const cq = String(c.cuotas || '').match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
    let desc = scrubCard(String(c.desc || '')).replace(/\s+/g, ' ').trim();
    for (let k = 0; k < 2; k++) desc = desc.replace(/\s*(COM\.?\s?CUOTA FIJA|COMPRAS INT\.VI|COMPRAS|INT\.VI|V\.CUOTAS|SDEB\.CAJA)\s*$/i, '').trim();
    return { d: `${yy}-${mm}-${dd}`, desc: desc.slice(0, 60), amt: v, n: cq ? Math.max(+cq[2], 1) : 1, k: cq ? +cq[1] : 1,
             cur: usd ? 'USD' : 'CLP', pago: /PAGO (PESOS|DOLAR) TEF|PAGOS? INT\.?VISA/i.test(desc) };
  }).filter(Boolean);
  const asOf = rows.map(rowText).join(' ').match(/No Facturados\s+al\s+(\d{2}\/\d{2}\/\d{4})/i);
  return { usd, items, asOf: asOf ? cellDate(asOf[1]) : today() };
}

/* Compensa anulaciones y reversas: un cargo negativo cancela a uno positivo del mismo monto */
function netUnbilled(items) {
  const pos = items.filter(i => !i.pago && i.amt > 0), neg = items.filter(i => !i.pago && i.amt < 0);
  const cancelled = new Set(), credits = [];
  neg.forEach(nI => {
    const cands = pos.filter(p => !cancelled.has(p) && Math.abs(p.amt + nI.amt) < 0.005);
    const pick = cands.find(p => /ANULACION/i.test(p.desc)) || cands.find(p => p.n === nI.n) || cands[0];
    if (pick) { cancelled.add(pick); cancelled.add(nI); } else credits.push(nI);
  });
  return { buys: pos.filter(p => !cancelled.has(p)), credits, cancelled: cancelled.size, payments: items.filter(i => i.pago).length };
}

function reviewUnbilled(parsed, bank) {

  const billed = latestStatements().find(st => st.card === card);
  const due = billed && stDue(billed) < parsed.asOf ? addToDate(stDue(billed), Math.max(1, Math.ceil(daysBetween(parsed.asOf, stDue(billed)) / 30))) : addToDate(parsed.asOf.slice(0, 8) + '10', 1);
  // Cruce con lo ya registrado (correos, cartola, manual, importaciones anteriores)
  const used = new Set(), seq = {};
  const pool = allTx().filter(t => !t.dupOf && t.source !== 'tarjeta');
  const rows = [...buys, ...credits].map(i => {
    const abs = Math.abs(i.amt), side = i.amt > 0 ? '-' : '+';

    seq[base] = (seq[base] || 0) + 1;

        ${payments ? `Se ignoran ${payments} pago${payments > 1 ? 's' : ''} a la tarjeta.` : ''} ${cancelled ? `${cancelled} cargos se compensan entre sí (anulaciones o reversas).` : ''}</p>
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="f">Tarjeta<select class="in" name="card">${[...new Set([card, ...cardIds])].map(k => `<option value="${esc(k)}">${esc(cardLabel(k))}</option>`).join('')}</select></label>
        <label class="f">Pago estimado<input type="date" name="due" value="${esc(due)}"></label>
      </div>
      ${fresh.length ? `<p class="calc">Nuevos: se agregan a Movimientos${parsed.usd ? ' como egresos internacionales' : ''}. Desmarca los que no quieras agregar.</p>
      <div class="items">${fresh.map((r, x) => `<label><input type="checkbox" data-nf="${x}" checked><span>${esc(r.desc)}<small>${dmy(r.d)}${r.n > 1 ? `, ${r.n} cuotas` : ''}${r.amt < 0 ? ', abono o devolución' : ''}</small></span><b class="money">${r.amt < 0 ? '−' : ''}${fmt(r.amt)}</b></label>`).join('')}</div>`
        : '<p class="notice">No hay movimientos nuevos: todo ya estaba registrado.</p>'}
      ${known.length ? `<details class="more"><summary>Ya registrados (${known.length})</summary><div class="items">${known.map(r => `<label style="cursor:default"><span></span><span>${esc(r.desc)}<small>${dmy(r.d)}, ${r.state === 'imported' ? 'importado antes' : 'coincide con ' + esc(displayName(r.match)) + ' (' + esc(originLabel(r.match)) + ')'}</small></span><b class="money">${fmt(r.amt)}</b></label>`).join('')}</div></details>` : ''}
      <p class="notice">Este documento pasa a ser la base de su período (${dmy(parsed.items.map(i => i.d).sort()[0] || parsed.asOf)} al ${dmy(parsed.asOf)}): reemplaza lo cargado antes desde estados de cuenta o no facturados de esta tarjeta en esas fechas. Tus correcciones de nombre, categoría y cuotas se mantienen.</p>
      <p class="calc">Las compras de este período también se agregan a Deudas para estimar tu próximo pago. Las suscripciones quedan fuera.</p>
      <div class="actions"><span></span><button class="btn" type="submit">Guardar</button></div>

                 amount: Math.abs(r.amt), currency: cur, fx: cur === 'USD' ? (rate() || undefined) : undefined, date: r.d, rawName: r.desc,

      const minD = parsed.items.map(i => i.d).sort()[0] || parsed.asOf;

      for (let x = recs.length - 1; x >= 0; x--) if (recs[x].date < from) recs.splice(x, 1);
      const docSnap = snap([`nb_${cardId}_${cur}`]);
