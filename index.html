      logImport(`No facturados ${cur === 'USD' ? 'internacionales' : 'nacionales'}, ${cardLabel(cardId)} al ${dmy(parsed.asOf)}`, [...docSnap, ...res.snapshot], recs.length);
      const added = recs.length;
      // Para Deudas: compras (y abonos) del período, en el formato de un estado de cuenta
      const items = [...buys, ...credits].map(i => {
        const vcRaw = i.n > 1 ? i.amt / i.n : i.amt;
        return { d: i.d, desc: i.desc, mo: i.amt, k: i.n > 1 ? Math.max(i.k, 1) : 1, n: i.n, vc: cur === 'USD' ? Math.round(vcRaw * 100) / 100 : Math.round(vcRaw),
                 cur: cur === 'USD' ? 'USD' : undefined, on: true, sub: i.amt > 0 && itemIsSub(i.desc, i.amt, i.n) };
      });
      const recId = `nb_${cardId}_${cur}`;
      put({ ...(S.recs[recId] || {}), id: recId, kind:'card_unbilled', card: cardId, bank, cur, date: parsed.asOf, due: el.due.value, items, deleted:false });
      cardLabel(cardId);
      dedupPass(); closeSheet(); render(); checkBudgetAlerts();
      toast(`Cargado: ${added} movimientos del período${res.replacedBefore ? `, reemplaza ${res.replacedBefore} de cargas anteriores` : ''}. Sin duplicados.`);
    });
  });
}


/* Líneas del estado de cuenta nacional: [lugar] fecha [código] descripción $monto $total cuota $valor */
const SKIP_LINE = /\b(MONTO CANCELADO|PAGO DOLAR|ABONO|TOTAL|SALDO|MONTO FACTURADO|CUPO|NOTA DE CREDITO|REVERSA|DEVOLUCION)\b/;
const GLUED_PLACE = /(SANTIAGO|LAS CONDES|PROVIDENCIA|PROVIDENCI|NUNOA|VITACURA|LA REINA|MACUL|HUECHURABA|RECOLETA|INDEPENDENCIA)$/;
function cleanStatementDesc(raw) {
  let d = scrubCard(String(raw || '').replace(/^\d{6,}\s+/, '').replace(/\bTASA\s+INT\.?\s*[\d.,]+\s*%/gi, '').replace(/\s+/g, ' ').trim());
  const g = norm(d).match(GLUED_PLACE);
  if (g && d.length - g[1].length >= 3) d = d.slice(0, d.length - g[1].length).trim();
  return d;
}
function parseStatementLine(line) {
  const m = line.match(/^(.{0,16}?)(\d{2})[\/.-](\d{2})[\/.-](\d{2,4})\s+(.+)$/);
  if (!m) return null;
  let y = +m[4]; if (y < 100) y += 2000;
  const date = `${y}-${m[3]}-${m[2]}`;
  const rest = m[5];
  // Montos en pesos: sin decimales. Los que traen coma decimal son dólares (van por parseIntlLine).
  const amts = [...rest.matchAll(/(-?\$\s?-?\d{1,3}(?:\.\d{3})+|-?\$\s?-?\d{1,6}|-?\d{1,3}(?:\.\d{3})+)(?![\d%,])/g)];
  if (!amts.length) return null;
  const desc = cleanStatementDesc(rest.slice(0, amts[0].index));
  if (!desc || (desc.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g) || []).length < 3 || /^US\$?$/i.test(desc) || SKIP_LINE.test(norm(desc))) return null;
  const neg = /-/.test(amts[0][1]);   // abono o reversa dentro de «cargos, comisiones, impuestos y abonos»
  const toNum = t => Number(t.replace(/[^\d]/g, ''));
  const mo = toNum(amts[0][1]);
  const after = rest.slice(amts[0].index + amts[0][0].length);
  const cq = after.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\b/);
  let k = 1, n = 1, vc = toNum(amts[amts.length - 1][1]) || mo;
  if (cq && +cq[2] >= 1 && +cq[2] <= 60 && +cq[1] <= +cq[2]) { k = +cq[1]; n = +cq[2]; }
  if (n === 1) { k = 1; vc = mo; }
  if (!(vc > 0)) return null;
  if (neg) return { d: date, desc: desc.slice(0, 60), mo: -mo, tp: -mo, rate: 0, k: 1, n: 1, vc: -mo, on: true };
  const tp = amts.length >= 3 ? toNum(amts[1][1]) : mo;          // monto total a pagar (incluye intereses)
  const rm = rest.match(/TASA\s+INT\.?\s*(\d+(?:,\d+)?)\s*%/i);   // tasa de interés mensual
  return { d: date, desc: desc.slice(0, 60), mo, tp, rate: rm ? parseFloat(rm[1].replace(',', '.')) : 0, k, n, vc, on: true };
}
/* Líneas del estado de cuenta internacional (en dólares): [ref] fecha descripción ciudad país montoOrigen montoUS$ */
function parseIntlLine(line) {
  const m = line.match(/(?:^|\s)(\d{2})\/(\d{2})\/(\d{2,4})\s+(.+?)\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s*$/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  const usd = Number(m[6].replace(/\./g, '').replace(',', '.'));
  if (!(usd > 0) || /^-/.test(m[5])) return null;
  let desc = scrubCard(m[4].replace(/\s+[A-Z]{2}$/, '').replace(/\s+[\d-]{7,}$/, '').trim());
  if (!desc || SKIP_LINE.test(norm(desc))) return null;
  return { d: `${y}-${m[2]}-${m[1]}`, desc: desc.slice(0, 60), mo: usd, k: 1, n: 1, vc: usd, cur: 'USD', on: true };
}
function guessBank(txt) {
  const t = norm(txt);
  if (/BANCO DE CHILE|BANCHILE|BANCOCHILE|BANCO EDWARDS/.test(t)) return 'bchile';
  if (/SANTANDER/.test(t)) return 'santander';
  if (/BANCOESTADO|BANCO ESTADO|CUENTARUT/.test(t)) return 'bestado';
  if (/\bBCI\b/.test(t)) return 'bci';
  if (/SCOTIABANK/.test(t)) return 'scotia';
  if (/ITAU/.test(t)) return 'itau';
  if (/FALABELLA/.test(t) && /CMR/.test(t)) return 'falabella';
  return S.settings.banks[0] || 'bchile';
}

const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return isoOf(x); };
/* Período facturado: «PERÍODO FACTURADO 24/07/2026 21/08/2026» o «DESDE … HASTA …» */
function findPeriod(lines) {
  const txt = lines.join('\n');
  let m = txt.match(/PER[IÍ]ODO FACTURADO\s*(?:DESDE\s*)?(\d{2}\/\d{2}\/\d{4})\s+(?:HASTA\s*)?(\d{2}\/\d{2}\/\d{4})/i);
  if (m) return { from: cellDate(m[1]), to: cellDate(m[2]) };
  const a = txt.match(/PER[IÍ]ODO FACTURADO DESDE\s*(\d{2}\/\d{2}\/\d{4})/i), b = txt.match(/PER[IÍ]ODO FACTURADO HASTA\s*(\d{2}\/\d{2}\/\d{4})/i);
  return { from: a ? cellDate(a[1]) : '', to: b ? cellDate(b[1]) : '' };
}
/* Pagos a la tarjeta dentro del estado de cuenta (se registran como «pago de tarjeta», no como gasto) */
function parsePaymentLine(line) {
  if (!/(MONTO CANCELADO|PAGO DOLAR TEF|PAGO PESOS TEF)/i.test(line)) return null;
  const m = line.match(/(\d{2})\/(\d{2})\/(\d{2,4})/);
  const amts = [...line.matchAll(/-\s?\$?\s?(\d[\d.]*(?:,\d{2})?)/g)];
  if (!m || !amts.length) return null;
  const raw = amts[amts.length - 1][1], usd = /,\d{2}$/.test(raw);
  const v = usd ? Number(raw.replace(/\./g, '').replace(',', '.')) : Number(raw.replace(/\./g, ''));
  let y = +m[3]; if (y < 100) y += 2000;
  return v > 0 ? { d: `${y}-${m[2]}-${m[1]}`, amt: v, cur: usd ? 'USD' : 'CLP' } : null;
}
/* Totales que informa el banco en el estado de cuenta (para comprobar la lectura) */
function bankTotals(lines) {
  const txt = lines.join('\n');
  const num = re => { const m = txt.match(re); return m ? (/-/.test(m[1]) ? -1 : 1) * Number(m[1].replace(/[^\d]/g, '')) : null; };
  const usd = re => { const m = txt.match(re); return m ? Number(m[1].replace(/\./g, '').replace(',', '.')) : null; };
  return {
    D: num(/TOTAL TRANSACCIONES EN UNA CUOTA\s*D?\s*\$\s*(-?[\d.]+)/i),
    E: num(/TOTAL TRANSACCIONES EN CUOTAS\s*E?\s*\$\s*(-?[\d.]+)/i),
    G: num(/TOTAL CARGOS, COMISIONES, IMPUESTOS Y ABONOS\s*G?\s*\$\s*(-?\s?[\d.]+)/i),
    B: num(/TOTAL PAGOS A LA CUENTA\s*B?\s*\$\s*(-?\s?[\d.]+)/i),
    total: num(/MONTO TOTAL FACTURADO A PAGAR[^$\n]*\$\s*([\d.]+)/i),
    usd: usd(/TOTAL DE COMPRAS\s*US\$\s*([\d.,]+)/i)
  };
}
/* Compara lo leído con los totales del banco */
function statementCheck(st) {
  const T = st.bankTotals || {};
  const cl = (st.items || []).filter(i => !i.cur), us = (st.items || []).filter(i => i.cur === 'USD');
  const fee = i => isFee(i) || i.vc < 0;
  const got = {
    D: cl.filter(i => i.n <= 1 && !fee(i)).reduce((a, i) => a + i.vc, 0),
    E: cl.filter(i => i.n > 1 && i.k >= 1).reduce((a, i) => a + i.vc, 0),
    G: cl.filter(i => i.n <= 1 && fee(i)).reduce((a, i) => a + i.vc, 0),
    B: -(st.payments || []).filter(p => p.cur === 'CLP').reduce((a, p) => a + p.amt, 0),
    usd: Math.round(us.reduce((a, i) => a + i.vc, 0) * 100) / 100
  };
  const rows = [['D', 'Compras en una cuota'], ['E', 'Cuotas del mes'], ['G', 'Comisiones, impuestos y abonos'], ['B', 'Pagos a la tarjeta'], ['usd', 'Compras internacionales (US$)']]
    .filter(([k]) => T[k] != null).map(([k, label]) => ({ k, label, bank: T[k], got: got[k], ok: Math.abs(T[k] - got[k]) < (k === 'usd' ? 0.02 : 2) }));
  return { rows, ok: rows.length > 0 && rows.every(r => r.ok) };
}
function checkHtml(st) {
  const C = statementCheck(st);
  if (!C.rows.length) return '';
  return `<details class="more" ${C.ok ? '' : 'open'}><summary>${C.ok ? 'Cuadra con los totales del banco' : 'Hay diferencias con los totales del banco'}</summary>
    <ul class="cost-list">${C.rows.map(r => `<li><span>${esc(r.label)}</span><b class="money ${r.ok ? 'inc' : 'exp'}">${r.ok ? 'cuadra' : 'difiere'}</b><small>Banco ${r.k === 'usd' ? fmtUSD(r.bank) : fmtCLP(r.bank)}; leído ${r.k === 'usd' ? fmtUSD(r.got) : fmtCLP(r.got)}</small></li>`).join('')}</ul></details>`;
}

/* Movimientos del período de un estado de cuenta: compras nuevas (sin cuotas o primera cuota), cargos del banco y pagos */
function statementRecs(st) {
  const due = stDue(st), seq = {}, recs = [];
  const idOf = (pfx, d, cur, amt, desc) => { const b = `${pfx}_${st.card}_${d}_${cur}_${amt}_${matchKey(desc).slice(0, 16).replace(/\s/g, '')}`; seq[b] = (seq[b] || 0) + 1; return b + '_' + seq[b]; };
  (st.items || []).forEach(i => {
    if (!i.on || i.d < st.from || i.d > st.to || (i.n > 1 && i.k > 1)) return;
    const cur = i.cur || 'CLP', amt = Math.abs(i.n > 1 ? i.mo : i.vc), credit = i.vc < 0;
    recs.push({ id: idOf('es', i.d, cur, amt, i.desc), kind:'tx', source:'estado', bank: st.bank, card: st.card, tipo: credit ? 'ingreso' : 'gasto',
                category: credit ? 'Reembolsos' : undefined, amount: amt, currency: cur,
                fx: cur === 'USD' ? (rate() || undefined) : undefined, date: i.d, rawName: i.desc, intl: cur === 'USD' || undefined,
                cuotas: i.n > 1 ? i.n : undefined, vc: i.n > 1 ? i.vc : undefined, firstDue: i.n > 1 ? (i.k === 0 ? addToDate(due, 1) : due) : undefined, reviewed: false });
  });
  (st.payments || []).forEach(p => {
    if (p.d < st.from || p.d > st.to) return;
    recs.push({ id: idOf('esp', p.d, p.cur, p.amt, 'pago'), kind:'tx', source:'estado', bank: st.bank, card: st.card, tipo:'pago_tarjeta', tipoLocked: true,
                amount: p.amt, currency: p.cur, fx: p.cur === 'USD' ? (rate() || undefined) : undefined, date: p.d, rawName: 'Pago de la tarjeta', reviewed: true });
  });
  return recs;
}

function findDates(lines) {
  const txt = lines.join('\n');
  const grab = re => { const m = txt.match(re); return m ? cellDate(m[1]) : ''; };
  return {
    date: grab(/fecha (?:de )?(?:facturaci[oó]n|estado de cuenta)[^\d\n]{0,25}(\d{2}[\/.-]\d{2}[\/.-]\d{2,4})/i),
    due: grab(/(?:pagar hasta|fecha (?:de )?vencimiento|vence(?: el)?)[^\d\n]{0,25}(\d{2}[\/.-]\d{2}[\/.-]\d{2,4})/i)
  };
}

function parseCuotaCell(v, totalCell) {
  const s = String(v ?? '').trim();
  let m = s.match(/(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/i);
  if (m) return { k: +m[1], n: +m[2] };
  const k = parseInt(s, 10), n = parseInt(String(totalCell ?? ''), 10);
  if (k > 0 && n >= k) return { k, n };
  return { k: 1, n: 1 };
}


async function importStatement(file) { return importAny(file, 'card'); }
async function importAny(file, hint) {
  try {
    if (/\.pdf$/i.test(file.name)) {
      toast('Leyendo el PDF…');
      const rows = await pdfRows(file);
      const lines = rows.map(rowText);
      if (/No Facturados/i.test(lines.slice(0, 12).join(' '))) {
        const parsed = parseUnbilledRows(rows);
        if (!parsed.items.length) { toast('No encontré movimientos en el PDF.'); return; }
        reviewUnbilled(parsed, guessBank(lines.join(' ')));
        return;
      }
      const items = lines.map(l => parseStatementLine(l) || parseIntlLine(l)).filter(Boolean);
      const isCard = /TARJETA DE CR[EÉ]DITO|ESTADO DE CUENTA (NACIONAL|INTERNACIONAL)|MONTO TOTAL FACTURADO|TOTAL TRANSACCIONES EN (UNA )?CUOTA|PER[IÍ]ODO FACTURADO/i.test(lines.join(' '));
      if (!(isCard && items.length >= 2)) {
        const acct = parseAccountRows(rows);
        if (acct.length) { reviewAccountCartola(acct, guessBank(lines.join(' '))); return; }
      }
      if (!items.length) { toast('No reconocí el formato del PDF. Si el banco permite exportar a Excel, prueba con ese archivo, o compárteme un ejemplo con tus datos tapados.'); return; }
      // Del documento solo se conservan cargos, pagos y fechas: nada de nombres, correos ni números de tarjeta.
      const per = findPeriod(lines), dts = findDates(lines);
      reviewStatement({ items, ...dts, ...per, date: dts.date || per.to || '', payments: lines.map(parsePaymentLine).filter(Boolean),
                        bankTotals: bankTotals(lines), bank: guessBank(lines.join(' ')), source:'pdf' });
      return;
    }
    let rows;
    if (/\.csv$/i.test(file.name)) rows = parseCSV(await file.text());
    else {
      await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type:'array', cellDates:true });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true, defval:'' });
    }
    if (hint === 'card') { mapStatementColumns(rows, S.settings.banks[0] || 'bchile'); return; }
    openSheet('¿Qué archivo es?', `<form class="form" id="kindForm">
      <fieldset style="border:0;padding:0;margin:0"><legend class="vh">Tipo</legend><div class="types">
        <label><input type="radio" name="k" value="cuenta" checked>Cartola de cuenta</label><label><input type="radio" name="k" value="tarjeta">Estado de cuenta de tarjeta</label></div></fieldset>
      <label class="f">Banco<select class="in" name="bank">${Object.entries(BANKS).map(([k, v]) => `<option value="${k}" ${S.settings.banks[0] === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <div class="actions"><span></span><button class="btn" type="submit">Continuar</button></div></form>`, sh => {
      $('#kindForm', sh).addEventListener('submit', ev => {
        ev.preventDefault();
        const el = ev.target.elements, bank = el.bank.value;
        closeSheet();
        if (el.k.value === 'tarjeta') mapStatementColumns(rows, bank); else importCartola(file, bank);
      });
    });
  } catch (e) { if (!/destroy/i.test(e.message)) toast('No se pudo leer el archivo: ' + e.message); }
}

function mapStatementColumns(rows, bank) {
  const hi = findHeader(rows);
  const header = (rows[hi] || []).map(c => String(c).trim());
  const saved = (S.settings.cardMaps || {})[bank] || {};
  const guess = re => header.findIndex(h => re.test(norm(h)));
  const map = {
    fecha: saved.fecha ?? guess(/FECHA/), desc: saved.desc ?? guess(/DESCRIP|DETALLE|GLOSA|COMERCIO|MOVIMIENTO/),
    monto: saved.monto ?? guess(/MONTO|IMPORTE|OPERACION/), cuota: saved.cuota ?? guess(/CUOTA/),
    total: saved.total ?? guess(/TOTAL CUOTAS|N.? CUOTAS/), vc: saved.vc ?? guess(/VALOR CUOTA|CUOTA MENSUAL/)
  };
  const opt = sel => `<option value="-1">No usar</option>` + header.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h || 'Columna ' + (i + 1))}</option>`).join('');
  const preview = rows.slice(hi, hi + 5).map(r => `<tr>${r.slice(0, 8).map(c => `<td>${esc(c instanceof Date ? isoOf(c) : scrubCard(c))}</td>`).join('')}</tr>`).join('');
  openSheet('Columnas del estado de cuenta', `
    <p class="calc">Indica qué columna es cada dato. Se recuerda para la próxima vez.</p>
    <div class="map-table"><table>${preview}</table></div>
    <form class="form" id="stMap" style="margin-top:14px">
      <label class="f">Banco<select class="in" name="bank">${Object.entries(BANKS).map(([k, v]) => `<option value="${k}" ${k === bank ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
      <label class="f">Fecha<select class="in" name="fecha">${opt(map.fecha)}</select></label>
      <label class="f">Descripción<select class="in" name="desc">${opt(map.desc)}</select></label>
      <label class="f">Monto de la compra<select class="in" name="monto">${opt(map.monto)}</select></label>
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="f">Cuota (ej. 03/06)<select class="in" name="cuota">${opt(map.cuota)}</select></label>
        <label class="f">Total de cuotas<small>Solo si va en otra columna</small><select class="in" name="total">${opt(map.total)}</select></label>
      </div>
      <label class="f">Valor de la cuota<small>Si no existe, se divide el monto por el total de cuotas</small><select class="in" name="vc">${opt(map.vc)}</select></label>
      <div class="actions"><span></span><button class="btn" type="submit">Continuar</button></div>
    </form>`, sh => {
    $('#stMap', sh).addEventListener('submit', e => {
      e.preventDefault();
      const el = e.target.elements;
      const m = { fecha:+el.fecha.value, desc:+el.desc.value, monto:+el.monto.value, cuota:+el.cuota.value, total:+el.total.value, vc:+el.vc.value };
      if (m.fecha < 0 || m.desc < 0 || (m.monto < 0 && m.vc < 0)) { toast('Elige al menos fecha, descripción y un monto.'); return; }
      const b = el.bank.value;
      S.settings.cardMaps = { ...(S.settings.cardMaps || {}), [b]: m }; save(); shareSettings();
      const items = [];
      rows.slice(hi + 1).forEach(r => {
        const d = cellDate(r[m.fecha]);
        const desc = scrubCard(String(r[m.desc] || '').trim());
        if (!d || !desc || SKIP_LINE.test(norm(desc))) return;
        const mo = m.monto > -1 ? cellNum(r[m.monto]) : 0;
        if (mo < 0) return;
        const { k, n } = m.cuota > -1 ? parseCuotaCell(r[m.cuota], m.total > -1 ? r[m.total] : '') : { k:1, n:1 };
        let vc = m.vc > -1 ? Math.abs(cellNum(r[m.vc])) : 0;
        if (!vc) vc = n > 1 ? Math.round(Math.abs(mo) / n) : Math.abs(mo);
        if (vc > 0) items.push({ d, desc: desc.slice(0, 60), mo: Math.abs(mo), k, n, vc, on: true });
      });
      closeSheet();
      if (!items.length) { toast('No encontré cargos con esas columnas.'); return; }
      reviewStatement({ items, date: '', due: '', bank: b, source:'excel' });
    });
  });
}


function reviewStatement(st) {
  st.items.forEach(i => { if (i.sub === undefined) i.sub = i.vc < 0 ? false : itemIsSub(i.desc, i.vc, i.n); });
  const lastDate = st.items.map(i => i.d).sort().pop() || today();
  const date = st.date || lastDate;
  const due = st.due || (() => { const d = new Date(date + 'T12:00'); d.setDate(d.getDate() + 15); return isoOf(d); })();
  const bank = st.bank;
  const cardIds = Object.keys(S.settings.cards || {}).filter(k => k.startsWith(bank + '-'));
  const defaultId = st.card || (cardIds.find(k => k.endsWith('-credito')) || bank + '-credito');
  const cardOpts = [...new Set([defaultId, ...cardIds])].map(k => `<option value="${esc(k)}" ${k === defaultId ? 'selected' : ''}>${esc(cardLabel(k))}</option>`).join('')
    + `<option value="__new">Otra tarjeta de ${esc(BANKS[bank] || 'este banco')}</option>`;
  const sorted = st.items.map((i, x) => [i, x]).sort((a, b) => (b[0].n > 1) - (a[0].n > 1) || a[0].d.localeCompare(b[0].d));
  const nInst = st.items.filter(i => i.n > 1).length;
  openSheet('Revisar estado de cuenta', `
    <form class="form" id="stRev">
      <p class="calc">Se leyeron ${st.items.length} cargos: ${nInst} en cuotas${(st.payments || []).length ? `, y ${st.payments.length} pagos a la tarjeta` : ''}. Del documento solo se guardan cargos, pagos y fechas.</p>
      ${checkHtml(st)}
      ${st.from ? `<p class="notice">Período facturado del ${dmy(st.from)} al ${dmy(st.to)}. Las compras de ese período pasan a Movimientos y reemplazan lo cargado antes (no facturados u otro estado de cuenta), sin duplicar.</p>` : ''}
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="f">Fecha del estado de cuenta<input type="date" name="date" value="${esc(date)}" required></label>
        <label class="f">Pagar hasta<input type="date" name="due" value="${esc(due)}"></label>
      </div>
      <div class="row2" style="grid-template-columns:1fr 1fr">
        <label class="f">Banco<select class="in" name="bank">${Object.entries(BANKS).map(([k, v]) => `<option value="${k}" ${k === bank ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
        <label class="f">Tarjeta<select class="in" name="card">${cardOpts}</select></label>
      </div>
      <p class="calc">Desmarca lo que no corresponda. Lo marcado como suscripción no se suma a las deudas.</p>
      <div class="items">${sorted.map(([i, x]) => `<label><input type="checkbox" data-i="${x}" ${i.on ? 'checked' : ''}>
        <span>${esc(i.desc)}<small>${dmy(i.d)}${i.n > 1 ? (i.k === 0 ? `, ${i.n} cuotas, la primera el próximo mes` : `, cuota ${i.k} de ${i.n}`) : ', sin cuotas'}${i.sub ? ' <span class="subtag">suscripción</span>' : ''}</small>
        ${i.n === 1 ? `<small><button type="button" class="link" style="font-size:12px;padding:0" data-subt="${x}">${i.sub ? 'No es suscripción' : 'Es suscripción'}</button></small>` : ''}</span>
        <b class="money">${i.cur === 'USD' ? fmtUSD(i.vc) : fmtCLP(i.vc)}</b></label>`).join('')}</div>
      <div class="sumline"><span>Total de este pago</span><b id="stNext"></b></div>
      <div class="sumline"><span>Deuda por pagar al ${dmy(date)}</span><b id="stDebt"></b></div>
      <div class="actions"><span></span><button class="btn" type="submit">Guardar</button></div>
    </form>`, sh => {
    const f = $('#stRev', sh);
    const current = () => ({ ...st, date: f.elements.date.value, due: f.elements.due.value, bank: f.elements.bank.value,
                             card: f.elements.card.value === '__new' ? '' : f.elements.card.value });
    const upd = () => {
      $$('[data-i]', sh).forEach(c => st.items[+c.dataset.i].on = c.checked);
      const cur = current();
      $('#stNext', sh).textContent = fmtCLP(stThisPayment(cur));
      $('#stDebt', sh).textContent = fmtCLP(stDebt(cur));
    };
    upd();
    f.addEventListener('change', e => {
      if (e.target.name === 'bank') { reviewStatement({ ...current(), card:'' }); return; }
      upd();
    });
    sh.addEventListener('click', e => {
      const b = e.target.closest('[data-subt]');
      if (!b) return;
      e.preventDefault();
      const it = st.items[+b.dataset.subt]; it.sub = !it.sub;
      reviewStatement(current());
    });
    f.addEventListener('submit', e => {
      e.preventDefault();
      upd();
      const b = f.elements.bank.value;
      let card = f.elements.card.value;
      if (card === '__new') { let n = 2; while ((S.settings.cards || {})[`${b}-credito${n}`]) n++; card = `${b}-credito${n}`; }
      cardLabel(card);
      const date = f.elements.date.value;
      const prevSt = statements().filter(x => x.card === card && x.date < date && x.id !== st.id).sort((a, c) => c.date.localeCompare(a.date))[0];
      const from = st.from || (prevSt ? addDays(prevSt.date, 1) : addDays(addToDate(date, -1), 1)), to = st.to || date;
      const docId = st.id || uid('cs'), docSnap = snap([docId]);
      const saved = put({ ...(st.id ? S.recs[st.id] : {}), id: docId, kind:'card_statement', card, bank: b,
            date, due: f.elements.due.value, from, to, source: st.source,
            payments: (st.payments || []).map(p => ({ d: p.d, amt: p.amt, cur: p.cur })), bankTotals: st.bankTotals || undefined,
            items: st.items.map(i => ({ d:i.d, desc: scrubCard(i.desc), mo:i.mo, tp: i.tp || undefined, rate: i.rate || undefined, k:i.k, n:i.n, vc:i.vc, cur: i.cur || undefined, on:i.on, sub:!!i.sub })) });
      // El estado de cuenta es la base de su período: reemplaza lo cargado antes desde documentos de esta tarjeta
      const recs = statementRecs(saved);
      const curs = new Set(recs.map(r => r.currency));
      const res = replacePeriod(t => (t.source === 'tarjeta' || t.source === 'estado') && t.card === card && curs.has(t.currency || 'CLP'), from, to, recs);
      logImport(`Estado de cuenta ${cardLabel(card)}, ${dmy(from)} al ${dmy(to)}`, [...docSnap, ...res.snapshot], recs.length);
      dedupPass();
      closeSheet(); go('deudas'); checkBudgetAlerts();
      toast(`Estado de cuenta guardado: ${recs.length} movimientos del ${dmy(from)} al ${dmy(to)}${res.replacedBefore ? `, reemplaza ${res.replacedBefore} de cargas anteriores` : ''}.`);
    });
  });
}

const encodeConn = () => 'FIN1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ u: S.settings.url, t: S.settings.token }))));
function decodeConn(code) {
  const c = String(code || '').trim().replace(/^FIN1:/, '');
  const j = JSON.parse(decodeURIComponent(escape(atob(c))));

  else if (act === 'categorize') openCategorize();
  else if (act === 'import-history') openImportHistory();
  else if (act === 'add-sub') openManualSub(null);
  else if (act === 'hon-csv') {
    const y = ($('#honYear') && $('#honYear').value) || S.ui.honYear || today().slice(0, 4);
    const rowsC = [['fecha', 'pagador', 'bruto', 'retencion', 'liquido'], ...allTx().filter(t => t.mode === 'honorarios' && t.date.startsWith(y)).sort((a, b) => a.date.localeCompare(b.date))
      .map(t => [t.date, (t.payer || '').replace(/[;"\n]/g, ' '), t.amount, t.amount - t.net, t.net])];
    const blob = new Blob(['\ufeff' + rowsC.map(r => r.join(';')).join('\n')], { type:'text/csv' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `honorarios-${y}.csv`; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }
  else if (act === 'edit-budget') openBudgetEditor();
  else if (act === 'copy-conn') {
    readSettings();
    if (!S.settings.url || !S.settings.token) { toast('Primero completa la dirección y el token.'); return; }
    try { await navigator.clipboard.writeText(encodeConn()); toast('Código copiado. Pégalo en Ajustes del otro dispositivo.'); }
    catch { prompt('Copia este código:', encodeConn()); }
  }
  else if (act === 'add-saving') openSavingEditor(null);
  else if (act === 'review-all') {
    const pend = new Set(pendingList().map(t => t.id));
    monthTx(S.ui.month).filter(t => pend.has(t.id)).forEach(t => { t.reviewed = true; put(t); });
    render(); toast('Movimientos marcados como revisados.');
  }
  else if (act === 'build-prompt') { $('#promptTxt').value = buildPrompt(+$('#iaPeriod').value); $('#promptBox').classList.remove('hide'); }
  else if (act === 'copy-prompt') {
    const ta = $(a.dataset.target || '#promptTxt');
    try { await navigator.clipboard.writeText(ta.value); toast('Copiado. Pégalo en Claude.'); }
    catch { ta.select(); document.execCommand('copy'); toast('Copiado.'); }
  }
  else if (act === 'rec-prompt') {
    const R = recommendations(), p = R.plan;
    $('#recTxt').value = buildPrompt(3) + `\n\n## Plan estimado para ${monthLong(p.nym)}\n- Ingresos esperados: ${fmtCLP(p.inc)}\n- Cuotas y créditos: ${fmtCLP(p.debt)}\n- Pagos fijos: ${fmtCLP(p.fixed)}\n- Suscripciones: ${fmtCLP(p.subs)}\n- Gasto variable habitual: ${fmtCLP(p.variable)}\n- Margen: ${signed(p.margin)}\n\nMi app sugiere:\n${R.list.map(x => '- ' + x.title + ': ' + x.detail).join('\n')}\n\nDame un plan concreto para ${monthLong(p.nym)}: cuánto gastar por categoría, cuánto ahorrar y qué evitar.`;
    $('#recBox').classList.remove('hide');
  }
  else if (act === 'buy-prompt') $('#buyBox').classList.remove('hide');
  else if (act === 'open-claude') window.open('https://claude.ai/new', '_blank', 'noopener');
  else if (act === 'save-answer') {
    const txt = $('#answerTxt').value.trim();
    put({ ...(S.recs['note_' + S.ui.month] || {}), id: 'note_' + S.ui.month, kind:'note', month: S.ui.month, text: txt, deleted: !txt });
    render(); toast(txt ? 'Respuesta guardada.' : 'Respuesta borrada.');
  }
  else if (act === 'ping') {
    readSettings();
    const st = $('#pingStatus'); st.textContent = 'Probando…';
    try { const j = await api({ action:'ping' }); if (j.rates) { S.settings.rates = j.rates; save(); } st.innerHTML = `Conectado. Dólar observado ${j.rates ? fmtCLP(j.rates.dolar) : 'no disponible'}. <a href="${esc(j.sheet)}" target="_blank" rel="noopener">Abrir hoja de datos</a>`; }
    catch (err) { st.textContent = 'No conecta: ' + err.message + '. Revisa la dirección (debe terminar en /exec) y el token.'; }
  }
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify({ settings: { ...S.settings, token: '' }, recs: S.recs }, null, 1)], { type:'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); link.download = `finanzas-respaldo-${today()}.json`; link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }
  else if (act === 'rescan') {
    if (!confirm('Se volverán a revisar los correos del período inicial. Los movimientos ya registrados no se duplican. ¿Continuar?')) return;
    try { await api({ action:'rescan' }); sync(); } catch (err) { toast('No se pudo: ' + err.message); }
  }
  else if (act === 'wipe') {
    if (!confirm('Se borrarán los datos guardados en este dispositivo. Los que ya sincronizaste siguen en tu hoja de Google y vuelven al sincronizar. ¿Continuar?')) return;
    S.recs = {}; S.settings.lastSync = 0; save(); render(); toast('Datos locales borrados.');
  }
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'buyForm') return;
  e.preventDefault();
  const q = readPurchaseForm();
  if (!(q.price > 0)) { toast('Ingresa el precio.'); return; }
  S.ui.lastQuery = q; showPurchase(q);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-tx]')) { e.preventDefault(); openTxEditor(e.target.dataset.tx); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-loan]')) { e.preventDefault(); openLoanEditor(e.target.dataset.loan); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-debt]')) { e.preventDefault(); const [sid, idx] = e.target.dataset.debt.split(':'); openItemEditor(sid, +idx); }
});

function readSettings() {
  const v = id => { const el = $('#' + id); return el ? el.value : undefined; };
  if (!$('#setUrl')) return;
  S.settings.url = v('setUrl').trim();
  S.settings.token = v('setToken').trim();
  S.settings.customDomains = v('setDomains');
  S.settings.ownNames = v('setOwn');
  S.settings.firstDays = Number(v('setDays')) || 90;
  S.settings.dolarManual = v('setDolar');
  S.settings.context = v('setContext');
  S.settings.banks = $$('[data-bank]').filter(c => c.checked).map(c => c.dataset.bank);
  if ($('#setCal')) { S.settings.calendarOn = $('#setCal').checked; S.settings.calendarAmounts = $('#setCalAmt').checked; }
  save();
  clearTimeout(readSettings.t);
  readSettings.t = setTimeout(shareSettings, 800);
}

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.name === 'theme' && el.closest('#tab-ajustes')) { S.settings.theme = el.value; applyTheme(); save(); return; }
  if (el.closest('#tab-ajustes') && !['cartolaFile', 'importFile', 'cartolaBank', 'connCode'].includes(el.id)) { readSettings(); if (el.dataset.bank) render(); return; }
  if (el.id === 'bankFilter') { S.ui.bankFilter = el.value; render(); }
  if (el.id === 'honYear') { S.ui.honYear = el.value; render(); }
  if (el.closest('#buyForm')) {
    const fe = $('#buyForm').elements;
    $('#buyCq').classList.toggle('hide', fe.mode.value !== 'cuotas');
    $('#buyRate').classList.toggle('hide', fe.interest.value !== 'si');
  }
  if (el.matches('[data-import="card"]') && el.files[0]) { const fl = el.files[0]; el.value = ''; await importStatement(fl); return; }
  if (el.matches('[data-import="any"]') && el.files[0]) { const fl = el.files[0]; el.value = ''; await importAny(fl, 'any'); return; }
  if (el.id === 'connCode' && el.value.trim()) {
    try { const j = decodeConn(el.value); S.settings.url = j.u; S.settings.token = j.t; save(); render(); toast('Dispositivo conectado. Sincronizando…'); sync(); }
    catch { toast('El código no es válido. Cópialo de nuevo desde el otro dispositivo.'); }
    return;
  }
  if (el.id === 'cartolaFile' && el.files[0]) { await importCartola(el.files[0], $('#cartolaBank').value); el.value = ''; }
  if (el.id === 'importFile' && el.files[0]) {
    try {
      const j = JSON.parse(await el.files[0].text());
      Object.values(j.recs || {}).forEach(r => { const l = S.recs[r.id]; if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) S.recs[r.id] = { ...r, dirty:true }; });
      S.settings = { ...S.settings, ...j.settings, url: S.settings.url, token: S.settings.token, lastSync: S.settings.lastSync };
      save(); render(); toast('Respaldo importado. Sincroniza para subirlo a tu hoja.');
    } catch (err) { toast('El archivo no es un respaldo válido.'); }
    el.value = '';
  }
});
document.addEventListener('input', e => { if (e.target.closest('#tab-ajustes') && e.target.id !== 'connCode' && e.target.matches('input[type=text],input[type=url],input[type=password],textarea')) readSettings(); });

$('#prevM').addEventListener('click', () => { S.ui.month = addMonths(S.ui.month, -1); render(); });
$('#nextM').addEventListener('click', () => { S.ui.month = addMonths(S.ui.month, 1); render(); });
$('#syncBtn').addEventListener('click', sync);
$('#fab').addEventListener('click', () => openTxEditor(null));
$('#gearBtn').addEventListener('click', () => go(S.ui.tab === 'ajustes' ? 'resumen' : 'ajustes'));
window.addEventListener('online', () => { renderHeader(); autoSync(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') autoSync();
  else if (Object.values(S.recs).some(r => r.dirty)) autoSync(true);
});
setInterval(() => { if (document.visibilityState === 'visible') autoSync(); }, 15 * 60000);
// Atajos en el Mac: ⌘R sincroniza, ⌘N agrega, ⌘1 a ⌘6 cambian de sección, ⌘← y ⌘→ cambian de mes.
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
  const tabs = ['resumen', 'movs', 'subs', 'deudas', 'ia', 'ajustes'];
  if (e.key === 'r') { e.preventDefault(); sync(); }
  else if (e.key === 'n') { e.preventDefault(); openTxEditor(null); }
  else if (/^[1-6]$/.test(e.key)) { e.preventDefault(); closeSheet(); go(tabs[+e.key - 1]); }
  else if (e.key === 'ArrowLeft' && !e.target.matches('input,textarea')) { e.preventDefault(); S.ui.month = addMonths(S.ui.month, -1); render(); }
  else if (e.key === 'ArrowRight' && !e.target.matches('input,textarea')) { e.preventDefault(); S.ui.month = addMonths(S.ui.month, 1); render(); }
});
window.addEventListener('offline', renderHeader);

/* ---------- diseño claro u oscuro ---------- */
const darkMq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme || 'light';
  const dark = t === 'dark' || (t === 'auto' && darkMq.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', dark ? '#000000' : '#E9EDEA');
  try { localStorage.setItem('fin-theme', t); } catch (e) { /* sin almacenamiento */ }
}
if (darkMq.addEventListener) darkMq.addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
else if (darkMq.addListener) darkMq.addListener(() => { if (S.settings.theme === 'auto') applyTheme(); });

/* ---------- actualizaciones ---------- */
function showUpdate(v) {
  if ($('#updBtn')) return;
  const b = document.createElement('button');
  b.id = 'updBtn'; b.className = 'update';
  b.textContent = v ? `Hay una versión nueva (${v}). Toca para actualizar.` : 'Hay una versión nueva. Toca para actualizar.';
  b.addEventListener('click', () => forceUpdate(v));
  document.body.appendChild(b);
}
/* Pregunta a tu página qué versión está publicada (version.json), sin usar la caché */
async function checkUpdate(manual) {
  const st = $('#updStatus');
  if (!location.protocol.startsWith('http')) { if (manual) toast('Abre la app desde su dirección web para buscar actualizaciones.'); return; }
  if (!navigator.onLine) { if (manual) toast('Sin conexión. Intenta cuando tengas internet.'); return; }
  if (st) st.textContent = 'Buscando…';
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 404 ? 'no encontré version.json en tu página; súbelo junto con index.html' : 'la página respondió ' + r.status);
    const j = await r.json();
    S.settings.lastUpdateCheck = Date.now(); save();
    if (+j.version > APP_VERSION) {
      if (st) st.textContent = `Versión ${j.version} disponible${j.notas ? ': ' + j.notas : ''}.`;
      if (manual) forceUpdate(j.version); else showUpdate(j.version);
    } else if (st) st.textContent = +j.version < APP_VERSION
      ? `Tu página tiene publicada la versión ${j.version}, pero esta app ya es la ${APP_VERSION}. Sube a GitHub el version.json nuevo.`
      : `Tienes la última versión publicada (${APP_VERSION}). Si te envié una más nueva, súbela a GitHub y vuelve a tocar el botón en 1 o 2 minutos.`;
  } catch (e) {
    if (st) st.textContent = 'No se pudo revisar: ' + e.message + '.';
    else if (manual) toast('No se pudo revisar: ' + e.message);
  }
}
/* Borra la copia guardada de la app (no tus datos) y recarga la versión nueva */
async function forceUpdate(v) {
  toast('Actualizando…');
  try { clearTimeout(saveTimer); if (DB.db) await DB.set('state', { settings: S.settings, recs: S.recs }); } catch (e) { /* se guardó antes */ }
  try { if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } } catch (e) { /* sin service worker */ }
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) { /* sin caché */ }
  location.replace(location.pathname + '?v=' + (v || Date.now()));
}

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hide'), 3800);
}

/* =====================================================================
   Inicio
   ===================================================================== */
(async function boot() {
  let data = null;
  try { await DB.open(); data = await DB.get('state'); }
  catch (e) { DB.db = null; try { data = JSON.parse(localStorage.getItem('finanzas') || 'null'); } catch { data = null; } }
  if (data) { S.settings = { ...DEFAULT_SETTINGS, ...data.settings }; S.recs = data.recs || {}; }
  let cleaned = 0;
  Object.values(S.recs).forEach(r => {
    if ('last4' in r) { delete r.last4; if (r.subject) r.subject = scrubCard(r.subject); r.dirty = true; r.updatedAt = Date.now(); cleaned++; }
  });
  if (cleaned) save();
  applyTheme();
  // Al estrenar una versión, recalcular duplicados y transferencias entre cuentas con las reglas nuevas
  if (S.settings.lastVersion !== APP_VERSION) { dedupPass(); S.settings.lastVersion = APP_VERSION; save(); }
  if (materializeFixed()) dedupPass();
  render();
  const mq = matchMedia('(min-width:900px)'), onMq = () => { if (S.ui.tab === 'resumen') render(); };
  if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  setTimeout(autoSync, 800);
  setTimeout(maybeMonthClose, 1500);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Al volver a la app se revisa si subiste una versión nueva a GitHub.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        reg.update().catch(() => {});
        if (Date.now() - (S.settings.lastUpdateCheck || 0) > 3600000) checkUpdate(false);
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) showUpdate(); });
    }).catch(() => {});
  }
  // Revisión automática al abrir (como máximo una vez por hora)
  if (Date.now() - (S.settings.lastUpdateCheck || 0) > 3600000) setTimeout(() => checkUpdate(false), 2500);
  // Si venimos de una actualización, quitar el ?v= de la dirección
  if (/[?&]v=/.test(location.search)) { history.replaceState(null, '', location.pathname); setTimeout(() => toast(`App actualizada a la versión ${APP_VERSION_LABEL}.`), 400); }
})();
</script>
